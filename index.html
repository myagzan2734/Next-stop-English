sum:"Kararlar, ikilemler ve pişmanlıklar. wish / if only ile şimdiki ve geçmişteki pişmanlıkları, third ve mixed conditional ile ‘olsaydı ne olurdu’ senaryolarını anlatırsın. Bir ikilemi tartışmayı ve seçenekleri tartmayı öğrenirsin.",
words:[["regret","pişman olmak; pişmanlık","I don’t regret leaving that job."],["in hindsight","sonradan bakınca","In hindsight, I should have waited."],["turn down","reddetmek","She turned down the offer."],["miss out on","kaçırmak (fırsat)","I don’t want to miss out on this chance."],["dilemma","ikilem","I’m facing a real dilemma."],["weigh up","tartmak, değerlendirmek","You need to weigh up the pros and cons."],["consequence","sonuç","Every decision has consequences."],["take for granted","kıymetini bilmemek","We take clean water for granted."],["have second thoughts","tereddüt etmek","I’m having second thoughts about moving."],["gut feeling","içgüdü, his","My gut feeling says it’s a mistake."],["go for it","hiç durma, dene","If you really want the job, go for it."],["on balance","her şey düşünüldüğünde","On balance, I think we made the right choice."]],
gram:[{t:"wish / if only",e:"Şimdiki durumdan şikâyet: wish + past simple (I wish I had more time). Geçmişe dair pişmanlık: wish + past perfect (I wish I had studied). Başkasının davranışından rahatsızlık: wish + would (I wish you would listen). if only daha güçlü bir vurgudur.",f:"I wish I knew. / I wish I had known. / I wish you would stop.",ex:["I wish I spoke better English.","If only I hadn’t sold my guitar.","I wish you would call me more often.","She wishes she had taken the job in Berlin."]},
{t:"Third and mixed conditionals",e:"Third conditional: geçmişte gerçekleşmemiş koşul ve geçmişteki sonucu (If + past perfect, would have + V3). Mixed conditional: geçmişteki koşulun bugünkü sonucu (If + past perfect, would + V1) ya da genel bir durumun geçmişteki sonucu (If + past simple, would have + V3).",f:"If I had stayed, I would have been promoted. / If I had stayed, I would be a manager now.",ex:["If I had left earlier, I wouldn’t have missed the flight.","If she had taken that job, she would be living in Canada now.","If I weren’t so shy, I would have spoken to her.","We might have won if we had trained harder."]}],
phr:{t:"Talking through a dilemma (İkilemi tartışma)",items:["I’m in two minds about it.","On the one hand… on the other hand…","What would you do in my position?","Have you considered the consequences?","If I were you, I’d sleep on it.","At the end of the day, it’s your decision."]},
lis:{t:"Two friends talk about a decision",text:"Maya: I’ve been offered a job in Singapore, but I’m in two minds about it.\nKerem: Wow. What’s holding you back?\nMaya: My parents, mainly. If my dad hadn’t been ill last year, I’d have said yes immediately. I’d feel guilty about leaving.\nKerem: I understand. But remember what happened to me. I turned down that job in Dublin, and I’ve regretted it ever since. If I had gone, I’d be speaking perfect English now!\nMaya: So you think I should go for it?\nKerem: I think you should sleep on it. But don’t miss out on something just because you’re afraid.",
q:[["Why is Maya unsure?",["She is worried about her parents","The salary is low","She doesn’t like Singapore"],0],["What does Kerem regret?",["Turning down a job in Dublin","Moving to Dublin","Learning English"],0],["What is Kerem’s advice?",["Sleep on it, but don’t let fear decide","Say no immediately","Ask her boss"],0]]},
spk:{p:["What do you wish were different about your life right now?","Talk about a decision you regret. What would have happened if you had chosen differently?","What do people often take for granted?","Role-play: A friend has a dilemma. Help them weigh up the options."],m:"I wish I had more free time, and I wish I lived closer to the sea. One decision I regret is not studying abroad. If I had spent a year in another country, I would be much more confident now. In hindsight, I was too afraid of leaving my friends. On balance, though, I don’t think regrets are useful unless we learn from them."},
wri:{task:"Bir dergi için ‘Verdiğim en zor karar’ başlıklı kişisel yazı yaz (180–220 kelime). wish ve mixed conditional kullan.",tips:["Durumu ve seçenekleri anlat.","Neye, neden karar verdin?","Sonradan bakınca ne düşünüyorsun? (In hindsight, I wish…)","Bugünkü hayatına etkisini mixed conditional ile anlat."],m:"The Hardest Decision I’ve Ever Made\n\nFour years ago, I had to choose between a secure job at a bank and a place on a design course that I had dreamed about since I was a teenager.\n\nEveryone had an opinion. My parents thought I would be mad to turn down a good salary. My friends told me to go for it. I spent weeks weighing up the pros and cons, and I changed my mind almost every day.\n\nIn the end, I followed my gut feeling and chose the course. The first year was extremely hard. I had very little money, and there were moments when I wished I had listened to my parents.\n\nIn hindsight, however, it was the best decision I could have made. If I had accepted the bank job, I would probably be earning more today, but I wouldn’t be doing work that I love. I also wouldn’t have met the people who are now my closest friends.\n\nI still wish I had been braver and started earlier. But on balance, I have learned that the decisions we regret most are usually the ones we were too afraid to make."},
quiz:[["I wish I ___ more time. I’m always busy.",["had","have","would have"],0],["If only I ___ that email yesterday!",["hadn’t sent","didn’t send","wouldn’t send"],0],["I wish you ___ stop interrupting me.",["would","will","had"],0],["If I had studied medicine, I ___ a doctor now.",["would be","would have been","will be"],0],["She ___ down the job because of the salary.",["turned","took","weighed"],0],["In ___, I should have asked for help.",["hindsight","balance","dilemma"],0]]},

{n:4,t:"Mysteries",tr:"Gizemler",
lessons:[["4.1","Olmuş olmalı","Past modals of deduction: must / might / can’t have","Evidence and crime"],["4.2","Yapmamalıydım","should have, needn’t have, didn’t need to","Mistakes"],["4.3","Tahmin yürütmek","Speculating","Speculation phrases"],["4.4","Proje","—","Çözülmemiş bir gizemi anlat"]],
sum:"Çözülmemiş olaylar, tahminler ve hatalar. Geçmişe dair çıkarımları must have / might have / can’t have ile, eleştiri ve gereksiz yapılan işleri should have / needn’t have ile anlatırsın. Kanıtlara dayanarak tahmin yürütmeyi öğrenirsin.",
words:[["evidence","kanıt","There’s no evidence that he was there."],["witness","tanık; tanık olmak","Two people witnessed the accident."],["clue","ipucu","The police have no clues."],["suspect","şüpheli; şüphelenmek","The main suspect has an alibi."],["theory","teori","There are several theories about what happened."],["vanish","ortadan kaybolmak","The plane vanished without a trace."],["puzzling","kafa karıştırıcı","It’s a puzzling case."],["hoax","aldatmaca","The photo turned out to be a hoax."],["coincidence","tesadüf","It can’t be a coincidence."],["rule out","olasılığı elemek","The police have ruled out robbery."],["figure out","çözmek, anlamak","I can’t figure out how he did it."],["alibi","mazeret, başka yerde olduğunun kanıtı","She has a strong alibi."]],
gram:[{t:"Past modals of deduction",e:"Geçmişte ne olduğuna dair çıkarım: must have + V3 (neredeyse eminim, olmuş), might / may / could have + V3 (belki olmuş), can’t / couldn’t have + V3 (olmuş olamaz). Devam eden eylem için: must have been + V-ing.",f:"He must have left. / She might have forgotten. / They can’t have known.",ex:["The thief must have had a key.","She might have taken the wrong train.","He can’t have done it – he was abroad.","They must have been waiting for hours."]},
{t:"should have, needn’t have, didn’t need to",e:"should have + V3: yapılmalıydı ama yapılmadı (eleştiri, pişmanlık). shouldn’t have + V3: yapılmamalıydı ama yapıldı. needn’t have + V3: yapıldı ama gereksizdi. didn’t need to + V1: gerek yoktu (yapılıp yapılmadığı belli değil, genelde yapılmadı).",f:"You should have told me. / I needn’t have hurried. / I didn’t need to pay.",ex:["You should have locked the door.","I shouldn’t have said that.","We needn’t have booked – the restaurant was empty.","I didn’t need to wait, so I went straight in."]}],
phr:{t:"Speculating (Tahmin yürütme)",items:["It’s hard to say, but…","My guess is that…","There’s no way that…","It looks as if…","That would explain why…","I wouldn’t be surprised if…"]},
lis:{t:"The missing painting",text:"Detective: So the painting was here at six, when the gallery closed, and it was gone by eight this morning.\nAssistant: Yes. The alarm didn’t go off, so the thief must have known the code.\nDetective: Or someone might have switched it off from inside. Who was the last person to leave?\nAssistant: The night guard. But he can’t have taken it. The cameras show him leaving with empty hands.\nDetective: Hmm. Look at this window. It’s unlocked. Someone should have checked it.\nAssistant: You’re right. The thief could have climbed out here. That would explain why the cameras saw nothing.",
q:[["Why do they think the thief knew the code?",["The alarm didn’t go off","The door was open","A guard told them"],0],["Why can’t the night guard have taken the painting?",["Cameras show him leaving with empty hands","He was on holiday","He doesn’t know the code"],0],["How might the thief have escaped?",["Through an unlocked window","Through the main door","Over the roof"],0]]},
spk:{p:["Describe a mystery you know. What do you think must have happened?","Talk about a mistake you made. What should you have done?","Have you ever prepared for something that you needn’t have prepared for?","Speculate: Your neighbour’s lights have been on for three days. Why?"],m:"One mystery that fascinates me is a ship that was found sailing with nobody on board. The crew can’t have left because of a storm, since everything was in perfect order. My guess is that they must have seen something that frightened them. I wouldn’t be surprised if we never figure it out. As for mistakes, I should have backed up my computer last month. I lost all my photos."},
wri:{task:"Bir gizemli olayı anlatan ve olası açıklamaları tartışan bir makale yaz (180–220 kelime). Past modals of deduction kullan.",tips:["Olayı kısaca anlat: ne, nerede, ne zaman.","İki ya da üç teori sun.","must have / might have / can’t have ile çıkarım yap.","Kendi görüşünle bitir."],m:"The Lighthouse Mystery\n\nIn December 1900, three lighthouse keepers disappeared from a tiny island off the coast of Scotland. When a supply ship arrived, the crew found the door closed, the beds made and a meal left on the table. No trace of the men was ever discovered.\n\nOver the years, many theories have been suggested. Some people believe the men must have been swept away by a huge wave while they were working outside. This would explain why two of the three waterproof coats were missing. However, the third man can’t have gone out in a storm without his coat, so something must have made him run outside in a hurry.\n\nOthers think the men might have had a violent argument. Life on the island was lonely, and one of them may have attacked the others before falling into the sea himself. There is no evidence for this, though.\n\nPersonally, I think the first two men were probably hit by a wave and the third must have rushed out to help them. The keepers should never have gone out in such weather, but after more than a century, we are unlikely ever to know the truth."},
quiz:[["The ground is wet. It ___ rained last night.",["must have","can’t have","should have"],0],["He ___ stolen it. He was with me all day.",["can’t have","must have","might have"],0],["I’m not sure where she is. She ___ missed the bus.",["might have","can’t have","needn’t have"],0],["You ___ told me earlier! Now it’s too late.",["should have","must have","needn’t have"],0],["We ___ taken umbrellas. It didn’t rain at all.",["needn’t have","mustn’t have","can’t have"],0],["The police have ___ out murder.",["ruled","figured","turned"],0]]},

{n:5,t:"Journeys",tr:"Yolculuklar ve kültür",
lessons:[["5.1","Yolda","Past perfect simple and continuous","Travel and adventure"],["5.2","Alışmak","used to, would, be used to, get used to","Living abroad"],["5.3","Bir anı anlatmak","Telling an anecdote","Anecdote phrases"],["5.4","Proje","—","Bir kültür şokunu anlat"]],
sum:"Uzun yolculuklar, yurt dışında yaşam ve kültür şoku. Geçmişteki bir andan önce süregelen eylemleri (past perfect continuous) ve alışkanlık yapılarını (used to / be used to / get used to) ayırt edersin. Anı anlatırken dinleyiciyi içine çeken kalıpları öğrenirsin.",
words:[["culture shock","kültür şoku","I experienced real culture shock in Tokyo."],["homesick","ev hasreti çeken","She felt homesick during the first month."],["off the beaten track","turistik olmayan, sapa","We prefer places off the beaten track."],["breathtaking","nefes kesici","The view from the top was breathtaking."],["itinerary","seyahat programı","Our itinerary includes three cities."],["set off","yola çıkmak","We set off at dawn."],["expat","yurt dışında yaşayan kişi","There’s a big expat community in Dubai."],["settle in","yerleşmek, alışmak","It took me months to settle in."],["customs","gelenekler","I love learning about local customs."],["hospitality","misafirperverlik","We were amazed by their hospitality."],["remote","uzak, ücra","They live in a remote village."],["wander","amaçsızca dolaşmak","We wandered through the old town."]],
gram:[{t:"Past perfect simple and continuous",e:"Past perfect simple (had + V3): geçmişteki bir andan önce tamamlanmış eylem. Past perfect continuous (had been + V-ing): geçmişteki bir ana kadar süren eylem, süre vurgusu ya da görünen sonucun nedeni. Durum fiilleri continuous almaz.",f:"I had walked 20 km. / I had been walking for hours.",ex:["By the time we arrived, the bus had already left.","We had been travelling for three days when we reached the border.","She was exhausted because she had been driving all night.","I had never seen snow before I moved to Canada."]},
{t:"used to, would, be used to, get used to",e:"used to + V1: geçmişteki alışkanlık ve durumlar. would + V1: geçmişte tekrarlanan eylemler (durum için kullanılmaz). be used to + V-ing / isim: alışkın olmak. get used to + V-ing / isim: alışmak (süreç).",f:"I used to live… / We would walk… / I’m used to driving… / I’m getting used to living…",ex:["I used to hate spicy food.","Every evening we would sit outside and talk.","I’m used to getting up early now.","She can’t get used to driving on the left."]}],
phr:{t:"Telling an anecdote (Anı anlatma)",items:["Did I ever tell you about the time…?","You won’t believe what happened next.","To cut a long story short,…","Anyway, as I was saying,…","It was one of those moments when…","Looking back, it was hilarious."]},
lis:{t:"Lost in the mountains",text:"Did I ever tell you about my trip to Georgia? We had been walking for about six hours when the weather suddenly changed. We had planned to reach a village before dark, but the path had disappeared under the snow. My phone had died, of course. To cut a long story short, we were completely lost. Then we saw a light. It was a tiny farmhouse. The family had never met foreigners before, but they invited us in, gave us soup and let us sleep by the fire. I’ve travelled a lot, but I’ve never forgotten their hospitality.",
q:[["How long had they been walking when the weather changed?",["About six hours","About two hours","All night"],0],["Why couldn’t they follow the path?",["It was under the snow","It was too dark","A bridge had collapsed"],0],["What did the family do?",["Gave them soup and a place to sleep","Called the police","Drove them to a hotel"],0]]},
spk:{p:["Tell an anecdote about a journey. Use past perfect simple and continuous.","What would you find hardest to get used to if you moved abroad?","What did you use to do on holiday as a child?","Do you prefer famous sights or places off the beaten track? Why?"],m:"Did I ever tell you about the time I missed my flight in Rome? I had been waiting at the wrong gate for an hour before I realised. To cut a long story short, I spent the night in the airport. If I moved abroad, I think I’d find it hard to get used to the food. As a child, we would always go to the same village by the sea, and I used to complain. Now I miss it."},
wri:{task:"Bir seyahat blogu için yaşadığın ya da duyduğun bir kültür şokunu anlat (180–220 kelime).",tips:["Yeri ve durumu tanıt.","Beklentin neydi? (I had expected…)","Neye alışmak zor oldu? (get used to)","Ne öğrendin?"],m:"Getting Used to Silence\n\nBefore I moved to Finland for a year, I had read a lot about the country. I had expected the cold and the dark winters. What I hadn’t expected was the silence.\n\nIn Turkey, I was used to noise: neighbours chatting on balconies, shopkeepers calling out, friends dropping in without warning. In my first week in Helsinki, I sat on a completely full bus and nobody said a word. I thought something terrible must have happened.\n\nIt took me months to get used to it. At first I felt lonely, and I would call my family every evening just to hear voices. I had been living there for about three months when a colleague invited me to her summer cottage. We sat by a lake for an hour without speaking, and for the first time it didn’t feel uncomfortable. I realised that, for her, silence was a way of sharing a moment.\n\nBy the time I left, I had learned to enjoy quiet. I still love the noise of home, but I no longer feel that every pause in a conversation has to be filled."},
quiz:[["We ___ for hours when we finally saw the village.",["had been walking","have been walking","were walked"],0],["When I got to the station, the train ___.",["had left","has left","had been leaving"],0],["I ___ live in a small town, but now I live in Izmir.",["used to","am used to","would"],0],["I’m not used to ___ so early.",["getting up","get up","got up"],0],["It took her a year to ___ used to the weather.",["get","be","have"],0],["We love small villages off the beaten ___.",["track","road","way"],0]]},

{n:6,t:"Planet",tr:"Gezegen",
lessons:[["6.1","Çevre sorunları","Advanced relative clauses; participle clauses","Environment"],["6.2","Buna rağmen","Contrast and concession: although, despite, whereas","Climate"],["6.3","Çözüm önermek","Proposing solutions","Proposal phrases"],["6.4","Proje","—","Yerel bir çevre sorunu için öneri"]],
sum:"İklim, çevre ve sürdürülebilirlik. Relative clause’ların ileri kullanımlarını (edatla, bütün cümleye bağlanan which, kısaltılmış yapılar) ve zıtlık bağlaçlarını (although, despite, whereas) öğrenirsin. Bir soruna çözüm önermeyi ve resmî bir öneri yazısı yazmayı çalışırsın.",
words:[["carbon footprint","karbon ayak izi","Flying increases your carbon footprint."],["emissions","salımlar","We must cut emissions by half."],["fossil fuels","fosil yakıtlar","We still depend on fossil fuels."],["drought","kuraklık","The drought destroyed the harvest."],["biodiversity","biyoçeşitlilik","Forests are rich in biodiversity."],["deforestation","ormansızlaşma","Deforestation is a serious threat."],["habitat","yaşam alanı","Many animals are losing their habitat."],["extinct","nesli tükenmiş","The species became extinct in 1936."],["conservation","koruma","She works in wildlife conservation."],["offset","dengelemek, telafi etmek","We plant trees to offset our emissions."],["landfill","çöp depolama alanı","Most plastic ends up in landfill."],["renewable","yenilenebilir","Solar power is a renewable source."]],
gram:[{t:"Advanced relative clauses and participle clauses",e:"Edatlı relative: the town in which I grew up (resmî) / the town I grew up in (gündelik). which bütün bir cümleyi niteleyebilir: He was late, which annoyed me. Relative clause kısaltılabilir: aktif için V-ing (people living here), pasif için V3 (plastic thrown away).",f:"…, which means… / the people living… / the waste produced…",ex:["Sea levels are rising, which threatens coastal cities.","This is the report on which the decision was based.","People living near factories breathe polluted air.","Most of the plastic produced each year is never recycled."]},
{t:"Contrast and concession",e:"although / even though + cümle. despite / in spite of + isim ya da V-ing (cümle için: despite the fact that). whereas / while iki farklı durumu karşılaştırır. however / nevertheless yeni cümleyi başlatır ve virgülle ayrılır.",f:"Although it was expensive,… / Despite the cost,… / …, whereas…",ex:["Although solar power is cheap, it isn’t widely used.","Despite the warnings, emissions are still rising.","In spite of living by the sea, he can’t swim.","Europe is cutting coal, whereas other regions are burning more."]}],
phr:{t:"Proposing solutions (Çözüm önerme)",items:["One way to tackle this would be to…","A more effective solution might be…","This would not only… but also…","The main drawback is that…","In the long term,…","We could start by…"]},
lis:{t:"A town meeting about plastic waste",text:"Chair: The first item tonight is plastic waste on our beaches. Mrs Aydın?\nAydın: Thank you. Despite our weekly clean-ups, the problem is getting worse. Most of the rubbish collected last month was single-use plastic from beach cafés.\nChair: What do you propose?\nAydın: One way to tackle this would be to ban plastic cups, which other towns have already done. Although some café owners are worried about costs, reusable cups are cheaper in the long term.\nChair: And the drawback?\nAydın: Tourists may complain at first. However, a deposit system would not only reduce waste but also bring in money for the clean-ups.",
q:[["What was most of the rubbish?",["Single-use plastic from cafés","Fishing nets","Glass bottles"],0],["What does Mrs Aydın propose?",["Banning plastic cups","Closing the beach","More clean-ups"],0],["What are café owners worried about?",["Costs","Losing staff","The weather"],0]]},
spk:{p:["What is the biggest environmental problem where you live? Propose two solutions.","Compare two countries or cities using whereas and although.","How could you reduce your own carbon footprint?","Discuss: Should governments ban short flights?"],m:"The biggest problem in my city is air pollution, which gets much worse in winter. One way to tackle this would be to make public transport free. Although it would be expensive, it would not only reduce traffic but also save people money. Despite all the warnings, most of us still drive everywhere. I could reduce my own footprint by eating less meat and flying less."},
wri:{task:"Belediyeye yerel bir çevre sorunu için resmî öneri yazısı (proposal) yaz (180–220 kelime). Başlıklar kullan.",tips:["Introduction: amacını belirt.","Current situation: sorunu verilerle anlat.","Recommendations: 2–3 somut öneri, zıtlık bağlaçlarıyla.","Conclusion: beklenen fayda."],m:"Proposal: Reducing Food Waste in Local Markets\n\nIntroduction\nThe aim of this proposal is to suggest ways of reducing the amount of food thrown away at the three weekly markets in our district.\n\nCurrent situation\nAt the end of each market day, large quantities of unsold fruit and vegetables are left in the street, which creates both a hygiene problem and unnecessary waste. Despite several complaints from residents, no system exists for collecting this food. Most of it ends up in landfill, where it produces harmful gases.\n\nRecommendations\nFirstly, I suggest setting up a collection point at each market, run by volunteers working with local charities. Food collected in the final hour could be given to families in need. Secondly, stallholders taking part in the scheme could be offered a small reduction in their fees. Although this would reduce the council’s income slightly, the cost of cleaning the streets would fall. Finally, any food which cannot be eaten could be turned into compost for the city’s parks.\n\nConclusion\nThis scheme would not only cut waste but also support vulnerable residents. Similar projects in other cities have been successful, and I believe ours would be too."},
quiz:[["Temperatures are rising, ___ worries scientists.",["which","that","what"],0],["Rubbish ___ on beaches harms sea life.",["left","leaving","which left"],0],["___ the rain, we went for a walk.",["Despite","Although","However"],0],["___ it was late, we carried on working.",["Although","Despite","In spite"],0],["The north is wet, ___ the south is dry.",["whereas","despite","however"],0],["Coal, oil and gas are ___ fuels.",["fossil","renewable","extinct"],0]]},

{n:7,t:"Mind",tr:"Zihin ve alışkanlıklar",
lessons:[["7.1","Hatırlamak ve unutmak","Gerund or infinitive: change of meaning","Mind and habits"],["7.2","İzin ve zorlama","make, let, allow; be made to, be allowed to","Wellbeing"],["7.3","Destek olmak","Showing empathy and giving support","Support phrases"],["7.4","Proje","—","30 günlük alışkanlık planı"]],
sum:"Zihin sağlığı, alışkanlıklar ve motivasyon. Anlamı değişen fiil kalıplarını (remember doing / remember to do, stop, try, regret) ve izin-zorlama yapılarını (make, let, be allowed to) öğrenirsin. Zor bir durumdaki birine empatiyle destek olmayı çalışırsın.",
words:[["wellbeing","iyi olma hâli","Exercise improves your mental wellbeing."],["mindfulness","bilinçli farkındalık","She practises mindfulness every morning."],["cope with","başa çıkmak","How do you cope with stress?"],["overwhelmed","bunalmış","I feel overwhelmed by my workload."],["resilience","dayanıklılık, toparlanma gücü","Children show amazing resilience."],["procrastinate","ertelemek","I always procrastinate before exams."],["self-esteem","öz saygı","Bullying damages self-esteem."],["anxiety","kaygı","He suffers from anxiety."],["unwind","gevşemek, kafa dinlemek","I unwind by cooking."],["boost","artırmak, güçlendirmek","A short walk can boost your mood."],["sleep deprivation","uyku yoksunluğu","Sleep deprivation affects your memory."],["stick to","bağlı kalmak, sürdürmek","It’s hard to stick to a routine."]],
gram:[{t:"Gerund or infinitive: change of meaning",e:"remember / forget + V-ing: geçmişteki bir anıyı hatırlamak / unutmak; + to V1: yapılması gerekeni hatırlamak / unutmak. stop + V-ing: bırakmak; + to V1: bir şey yapmak için durmak. try + V-ing: denemek (deneme olarak); + to V1: çabalamak. regret + V-ing: pişman olmak; + to V1: üzülerek bildirmek.",f:"I remember locking it. / Remember to lock it.",ex:["I remember meeting her in Paris.","Remember to switch off your phone.","He stopped smoking last year.","We stopped to have a coffee."]},
{t:"make, let, allow",e:"make + nesne + V1: zorlamak, yaptırmak. let + nesne + V1: izin vermek. allow + nesne + to V1: izin vermek (daha resmî). Edilgende: be made to + V1 ve be allowed to + V1 (let’in edilgeni kullanılmaz).",f:"They made me wait. / I was made to wait. / She let me leave. / I was allowed to leave.",ex:["My boss made me rewrite the report.","We were made to work at weekends.","My parents never let me stay out late.","Employees are allowed to work from home on Fridays."]}],
phr:{t:"Showing empathy (Empati kurma)",items:["That sounds really tough.","I can imagine how you feel.","You’re not alone in this.","Have you thought about talking to someone?","Take it one step at a time.","I’m here if you need me."]},
lis:{t:"Advice on building habits",text:"Most people try to change everything at once, and that’s why they give up. If you want a habit to last, start small. Don’t try to run five kilometres on your first day. Just remember to put your trainers by the door. Second, connect the new habit to something you already do. For example, after I stop to have my morning coffee, I write for ten minutes. Third, don’t let one bad day make you quit. Research suggests that missing a single day has almost no effect, but missing two in a row makes it much harder to stick to your plan.",
q:[["Why do most people give up?",["They try to change everything at once","They are lazy","They have no time"],0],["What is the second tip?",["Connect the habit to something you already do","Tell your friends","Use an app"],0],["What makes it harder to stick to a plan?",["Missing two days in a row","Missing one day","Starting small"],0]]},
spk:{p:["What do you do to unwind? What boosts your mood?","Talk about something you remember doing as a child and something you often forget to do.","What were you made to do at school? What weren’t you allowed to do?","Role-play: A friend feels overwhelmed. Show empathy and give support."],m:"To unwind, I usually go for a long walk without my phone. I remember learning to ride a bike with my grandfather, but I often forget to drink enough water. At school we were made to wear a uniform, and we weren’t allowed to use phones. If a friend felt overwhelmed, I’d say: that sounds really tough. Take it one step at a time, and I’m here if you need me."},
wri:{task:"Bir öğrenci dergisi için ‘Ertelemeyi nasıl bıraktım?’ konulu tavsiye yazısı yaz (180–220 kelime).",tips:["Kişisel bir örnekle başla.","3 somut tavsiye ver (try + -ing, remember to…).","Kendi deneyiminle destekle.","Motive edici bir cümleyle bitir."],m:"How I Stopped Procrastinating\n\nLast year, I handed in almost every assignment late. I remember sitting at my desk at midnight, feeling overwhelmed and promising myself that it would never happen again. It always did.\n\nWhat finally worked was not willpower but three simple changes.\n\nFirst, I stopped trying to do everything at once. I now divide each task into steps that take no more than twenty-five minutes. Starting is much easier when the first step is tiny.\n\nSecond, I don’t let my phone stay on my desk. It sounds obvious, but try leaving it in another room for an hour. You will be amazed how much you get done.\n\nThird, I made a friend check on me. Every Sunday we tell each other our plans for the week. Being made to explain why I hadn’t finished something was embarrassing enough to make me work.\n\nI still procrastinate sometimes, and I have learned not to feel guilty about it. But I no longer regret wasting whole weekends. If I can stick to a plan, anyone can. Remember to start small, and take it one step at a time."},

sum:"Tartışma, ikna ve eleştirel düşünme. Vurgulamak istediğin bilgiyi öne çıkarmak için cleft sentence’ları, söylenenleri özetlemek için farklı kalıplar alan raporlama fiillerini (accuse of, insist on, urge to) öğrenirsin. Bir argümanı yapılandırmayı ve karşı görüşe cevap vermeyi çalışırsın.",
words:[["persuade","ikna etmek","She persuaded me to change my mind."],["compelling","ikna edici, etkileyici","He made a compelling argument."],["controversial","tartışmalı","It’s a controversial topic."],["assumption","varsayım","Don’t make assumptions about people."],["counter-argument","karşı argüman","A good essay considers the counter-argument."],["point out","belirtmek, dikkat çekmek","She pointed out a mistake in the data."],["back up","desteklemek","You need evidence to back up your claim."],["generalise","genelleme yapmak","It’s dangerous to generalise."],["objective","nesnel","Try to be objective."],["claim","iddia etmek; iddia","He claims that he was misquoted."],["play devil’s advocate","şeytanın avukatlığını yapmak","Let me play devil’s advocate for a moment."],["flawed","kusurlu, hatalı","The study was seriously flawed."]],
gram:[{t:"Cleft sentences",e:"Cümlenin bir bölümünü vurgulamak için kullanılır. What + cümle + be + vurgulanan bölüm (What I need is a holiday). It + be + vurgulanan bölüm + that / who… (It was the price that surprised me). The thing / reason / person… ile de kurulur.",f:"What I love is… / It was … that … / The reason (why) … is …",ex:["What I find surprising is the lack of evidence.","It was the minister who made the decision.","What we need is a completely new approach.","The reason I disagree is that the data is old."]},
{t:"Reporting verbs",e:"Söyleneni kelimesi kelimesine aktarmak yerine fiille özetlenir. + to V1: agree, offer, refuse, threaten. + nesne + to V1: advise, urge, warn, encourage, remind. + V-ing: deny, admit, suggest. + edat + V-ing: accuse sb of, apologise for, insist on, blame sb for. + that: claim, explain, point out.",f:"He denied taking it. / She urged us to act. / They accused him of lying.",ex:["She accused the company of hiding the facts.","He apologised for interrupting.","Experts urged the government to act quickly.","They insisted on seeing the evidence."]}],
phr:{t:"Structuring an argument (Argüman kurma)",items:["The key point here is…","What this shows is that…","Some people would argue that…","That may be true, but…","Let me give you an example.","To sum up, the evidence suggests…"]},
lis:{t:"A classroom debate",text:"Teacher: Today’s motion is that homework should be banned. Ali, you’re in favour.\nAli: Thank you. What students need is time to rest, not more work. Several studies claim that too much homework causes stress without improving results.\nTeacher: Zeynep, your response?\nZeynep: That may be true for young children, but it was homework that taught me to work independently. Ali accuses schools of overloading students. What I would point out is that the problem is the amount, not the idea.\nAli: So you admit that there is a problem.\nZeynep: I suggest limiting homework, not banning it.",
q:[["What does Ali say students need?",["Time to rest","More tests","Longer lessons"],0],["What did homework teach Zeynep?",["To work independently","To read faster","To work in a team"],0],["What does Zeynep suggest?",["Limiting homework","Banning homework","Doubling homework"],0]]},
spk:{p:["Give a two-minute persuasive talk: ‘Everyone should learn a second language.’","Use cleft sentences: What I love about my city is… / It’s … that annoys me.","Report an argument you had or heard using reporting verbs.","Play devil’s advocate: argue that social media is good for teenagers."],m:"What I love about my city is its energy. It’s the traffic that annoys me most. Last week my sister and I had an argument. She accused me of never listening, I denied it, and in the end I apologised for interrupting her. If I played devil’s advocate, I’d point out that social media helps shy teenagers make friends. That may be true, but what the evidence suggests is that too much of it damages sleep."},
wri:{task:"Tartışmacı kompozisyon: ‘Üniversite eğitimi herkes için ücretsiz olmalı.’ (200–240 kelime). Karşı görüşe yer ver ve cevapla.",tips:["Giriş: konuyu tanıt ve tezini belirt.","İki güçlü argüman, kanıtlarla.","Karşı argüman ve çürütme (Some people would argue…, however…).","Sonuçta cleft sentence ile vurgu yap."],m:"Should university education be free for everyone?\n\nFew topics are as controversial as the cost of higher education. In my view, university should be free, or at least affordable, for anyone who has the ability to study.\n\nThe key argument is fairness. In many countries, it is family income rather than talent that decides who goes to university. What this means is that society loses thousands of potential doctors, engineers and teachers every year. A recent report claimed that students from poorer backgrounds are far less likely to apply, even when their grades are excellent.\n\nFurthermore, education benefits everyone, not only the individual. Graduates tend to earn more and therefore pay more tax, which eventually covers the cost of their studies.\n\nSome people would argue that free education is too expensive and that students value things more when they pay for them. That may be true to some extent. However, the countries which have chosen this path have not gone bankrupt, and there is little evidence to back up the second claim.\n\nTo sum up, what a modern economy needs is educated citizens. It is short-sighted to treat university as a luxury rather than an investment in our shared future."},

{t:"Okuma",text:"For most of history, people slept in two parts. Diaries and letters written before the industrial age often refer to a ‘first sleep’ and a ‘second sleep’, separated by an hour or two of quiet activity. People would pray, talk or even visit neighbours. The habit is thought to have disappeared when street lighting made evenings longer and factory hours made mornings earlier. Despite this, many people today wake in the middle of the night and assume something is wrong. Some researchers suggest they needn’t worry. What we call insomnia may sometimes be an older pattern returning. However, others point out that modern life rarely lets us sleep late enough to make two sleeps practical.",

{t:"Dinleme",audio:"Interviewer: You gave up a well-paid job to sail around the world. Do you regret it?\nSailor: Not for a second. If I had stayed, I’d probably be a director by now, but I’d also be exhausted.\nInterviewer: What was the hardest part?\nSailor: Getting used to being alone. I had been at sea for forty days when I finally saw another boat. I actually cried.\nInterviewer: And what’s next?\nSailor: By this time next year, I’ll have written a book about it. I’m about to sign the contract.",

wri:{task:"Görüş yazısı: ‘Uzaktan çalışma, ofiste çalışmaktan daha iyidir.’ Katılıyor musun? (200–240 kelime). Zıtlık bağlaçları ve cleft sentence kullan.",m:"Is remote work better than office work?\n\nSince working from home became common, many employees have refused to return to the office. Although I understand why, I believe the best solution lies somewhere in between.\n\nThere is no doubt that remote work has advantages. Employees no longer waste hours commuting, which gives them more time for family and exercise. Companies also save money on office space. What surprised many managers was that productivity did not fall; in some cases it actually rose.\n\nHowever, there are serious drawbacks. Despite video calls, people working alone often feel isolated, and younger staff miss the chance to learn by watching experienced colleagues. It is the informal conversations in corridors that often produce the best ideas, and these rarely happen online. Moreover, when your home is your office, it becomes harder to stop working in the evening.\n\nSome people would argue that these problems can be solved with better technology. That may be true to some extent, but no software can replace human contact completely.\n\nOn balance, what most people need is flexibility. A system in which employees spend two or three days in the office and the rest at home would give us the benefits of both."}},

{t:"Okuma",text:"When the city of Curitiba in Brazil began to grow rapidly in the 1970s, it could not afford an underground railway. Instead, planners designed a bus system which worked like a metro. Buses were given their own lanes, passengers paid before boarding and stations were built as glass tubes at the same height as the bus floor. Although critics claimed the idea was too simple to work, the system soon carried more passengers per hour than many rail lines, at a fraction of the cost. It has since been copied by more than a hundred cities. What the story shows is that expensive technology is not always the answer. Sometimes it is a clever use of existing resources that makes the difference.",
qs:[["Why didn’t the city build an underground railway?",["It couldn’t afford one","The ground was too soft","Residents voted against it"],0],["How was the bus system like a metro?",["Own lanes and payment before boarding","It ran underground","It used trains"],0],["What did critics say?",["The idea was too simple to work","It was too expensive","It was dangerous"],0],["What is the main message?",["Clever use of resources can beat expensive technology","Buses are better than trains","Cities should not grow"],0]]},

wri:{task:"Bir gizemi ya da açıklanamayan bir olayı anlatan, olası açıklamaları tartışan bir makale yaz (200–240 kelime).",m:"The Hum Nobody Can Explain\n\nIn towns across the world, a small number of people report hearing a low, constant noise, usually at night. It is known simply as ‘the Hum’. Although it has been reported for decades, nobody has been able to say with certainty what causes it.\n\nSeveral explanations have been put forward. Some researchers believe the noise must come from industrial equipment, such as factory fans or gas pipelines. In one town, the Hum is said to have stopped when a nearby factory closed, which supports this theory. However, this can’t be the whole answer, because the sound has also been reported in remote places.\n\nOthers suggest that the cause might be inside the listener. People who hear the Hum may simply have unusually sensitive hearing, or the sound may be produced by the ear itself. The fact that most people in the same house hear nothing seems to back this up.\n\nPersonally, what I find most convincing is a combination of the two. There may be real low-frequency sounds that only a few people can detect. Whatever the truth, those who suffer should be taken seriously rather than accused of imagining things."}}

words:[["nuance","ince anlam farkı","A good translator understands every nuance."],["connotation","çağrışım, yan anlam","‘Cheap’ has a negative connotation."],["ambiguous","iki anlama gelebilen, belirsiz","The instructions were ambiguous."],["articulate","düşüncesini iyi ifade eden; açıkça ifade etmek","She’s an articulate speaker."],["jargon","meslek dili","Legal jargon confuses most people."],["bilingual","iki dilli","Their children are bilingual."],["register","dil düzeyi, üslup","Use a formal register in the report."],["get across","anlatabilmek, iletmek","He struggled to get his point across."],["convey","iletmek, aktarmak","Colours can convey emotion."],["idiom","deyim","‘Break the ice’ is a common idiom."],["mother tongue","ana dil","Turkish is my mother tongue."],["lost in translation","çeviride kaybolan","The joke was lost in translation."]],
gram:[{t:"Inversion with negative adverbials",e:"Olumsuz ya da sınırlayıcı bir zarf cümlenin başına gelirse özne ile yardımcı fiil yer değiştirir (soru sırası). Resmî ve vurgulu bir üsluptur. Sık kullanılanlar: never, rarely, seldom, not only… but also, hardly… when, no sooner… than, little, under no circumstances, only then.",f:"Never have I seen… / Not only did she…, but she also… / Hardly had we… when…",ex:["Never have I heard such a moving speech.","Not only does she speak Arabic, but she also writes poetry in it.","Hardly had I sat down when the phone rang.","Little did we know how difficult it would be."]},

lis:{t:"A talk on bilingualism",text:"For a long time, it was assumed that bilingual children were confused by having two languages. Not only has this idea been disproved, but research now suggests the opposite. Seldom do bilingual speakers mix their languages by accident. When they switch, they usually do so for a reason, such as conveying a nuance that only one language can express. What I find most interesting is identity. Many bilingual people report that they feel like a slightly different person in each language. That may sound strange, but it does make sense. A language is not just vocabulary. It carries humour, politeness and a whole way of seeing the world.",
q:[["What was once assumed about bilingual children?",["They were confused by two languages","They learned faster","They spoke later but better"],0],["Why do bilingual speakers usually switch languages?",["For a reason, such as conveying a nuance","Because they forget words","By accident"],0],["What do many bilingual people report?",["Feeling like a different person in each language","Losing their mother tongue","Dreaming in one language only"],0]]},
spk:{p:["Do you feel like a different person when you speak English? In what way?","Describe a word or idiom in Turkish that is lost in translation.","Retell a memorable experience using inversion: Never have I… / Hardly had I…","Discuss: Will translation technology make language learning unnecessary?"],m:"I do feel slightly different in English. I’m more direct, perhaps because my vocabulary is smaller. A Turkish word that gets lost in translation is ‘gönül’. It isn’t exactly heart or soul; it’s somewhere in between. Never have I found an English word that conveys the same nuance. As for technology, I may be wrong, but I doubt a machine will ever get humour across."},
wri:{task:"Bir kültür dergisi için ‘Dil, düşünme biçimimizi şekillendirir mi?’ konulu deneme yaz (220–260 kelime). En az iki devrik yapı kullan.",tips:["Dikkat çekici bir girişle başla.","Bir lehte, bir aleyhte argüman sun.","Devrik yapı ve vurgu yapılarını abartmadan kullan.","Kişisel bir gözlemle bitir."],m:"Does language shape the way we think?\n\nRarely do we stop to consider the words we use. Yet some linguists argue that our mother tongue quietly influences how we perceive time, colour and even responsibility.\n\nThere is intriguing evidence for this view. Speakers of languages that have several words for different shades of blue tend to distinguish those shades slightly faster. Not only do such findings suggest a link between vocabulary and perception, but they also raise a larger question: if two people describe the world differently, do they experience it differently?\n\nI do think the claim can be exaggerated, however. People are perfectly capable of understanding concepts for which their language has no single word. English has no equivalent of the Turkish ‘gönül’, but an English speaker can grasp the idea once it is explained. What language gives us, in other words, is not a prison but a set of habits.\n\nMy own experience supports this more modest view. When I speak English, I find myself being more direct; in Turkish, I pay closer attention to politeness and age. Little did I realise, when I began learning, that I was acquiring a second way of behaving as well as a second vocabulary.\n\nLanguage, then, does not determine thought. It does, nevertheless, give each of us a particular window through which to look."},

lessons:[["2.1","Eğer öyle olsaydı","Advanced conditionals: inverted forms; provided, unless, supposing","Politics and influence"],["2.2","Temkinli dil","Hedging and distancing","Public debate"],["2.3","Kibarca karşı çıkmak","Conceding and challenging","Debate phrases"],["2.4","Proje","—","Bir politikayı savunan kısa konuşma"]],
sum:"Güç, siyaset ve kamuoyu. Resmî üslupta kullanılan devrik koşul cümlelerini (Had I known…, Were we to…, Should you need…) ve iddiayı yumuşatan temkinli dili (It would seem that…, tends to) öğrenirsin. Bir görüşü kısmen kabul edip karşı çıkmayı çalışırsın.",
words:[["rhetoric","söylem, hitabet","His speech was full of empty rhetoric."],["leverage","koz, etki gücü","The union has little leverage."],["accountable","hesap verebilir","Leaders must be held accountable."],["transparency","şeffaflık","Voters demand greater transparency."],["lobby","lobi yapmak; lobi","Companies lobby against the new law."],["mandate","yetki, vekâlet","The government has a clear mandate."],["undermine","baltalamak, zayıflatmak","The scandal undermined public trust."],["consensus","fikir birliği","There is no consensus on the issue."],["scrutiny","yakın inceleme","The plan came under intense scrutiny."],["sway","etkilemek, fikrini değiştirmek","Voters were swayed by the debate."],["concede","kabul etmek, teslim etmek","She conceded that mistakes were made."],["stance","duruş, tutum","What is your stance on taxation?"]],
gram:[{t:"Advanced conditionals",e:"Resmî üslupta if atılıp devrik yapı kullanılır: Had + özne + V3 (third), Were + özne + to V1 (second), Should + özne + V1 (first, olasılık düşük). if yerine: provided / providing (that), as long as (şartıyla), unless (…medikçe), supposing (diyelim ki), but for + isim (… olmasaydı).",f:"Had I known,… / Were we to raise taxes,… / Should you need help,…",ex:["Had the government acted sooner, the crisis would have been avoided.","Were we to lose this vote, the project would end.","Should you have any questions, please contact my office.","But for her support, I would never have been elected."]},
{t:"Hedging and distancing",e:"Akademik ve gazetecilik dilinde iddia yumuşatılır: It seems / appears that…, It would seem that…, tend to, be likely to, arguably, apparently, to some extent, there is some evidence that… Kesin konuşmaktan kaçınmak güvenilirliği artırır.",f:"It would appear that… / This tends to… / Arguably,…",ex:["It would appear that turnout was lower than expected.","Voters tend to trust local politicians more.","This is arguably the most important election in decades.","There is some evidence to suggest that the policy has failed."]}],
phr:{t:"Conceding and challenging (Kabul edip karşı çıkma)",items:["I take your point, but…","That’s a fair point. However,…","I’d go along with that up to a point.","With respect, I think that misses the point.","You could argue that, but…","Granted, but that doesn’t mean…"]},
lis:{t:"A panel discussion on trust in politics",text:"Chair: Why has trust in politicians fallen so sharply?\nProfessor Demir: It would seem that the main cause is a lack of transparency. People tend to assume the worst when decisions are made behind closed doors.\nJournalist: I take your point, but I think that misses something. Had the media reported these decisions more carefully, the public would have understood them better. We concentrate on scandal.\nProfessor Demir: That’s a fair point. Arguably, both sides are responsible.\nChair: So what would restore trust?\nJournalist: Were politicians to admit their mistakes openly, I believe voters would forgive far more than they do now.",
q:[["What does the professor see as the main cause?",["A lack of transparency","Low salaries","Too many elections"],0],["What does the journalist say about the media?",["It concentrates on scandal","It is always accurate","It supports the government"],0],["What would restore trust, according to the journalist?",["Politicians admitting mistakes openly","More debates","Stricter laws"],0]]},
spk:{p:["What makes a speaker persuasive? Think of someone you find convincing.","Hedge these claims: ‘Social media ruins politics.’ ‘Young people don’t vote.’","Complete: Had I been born in another country,… / Were I in charge of my city,…","Role-play: Disagree politely with a colleague’s proposal, conceding one point."],m:"What makes a speaker persuasive is, arguably, honesty rather than clever rhetoric. I’d hedge the first claim like this: social media tends to make political debate more aggressive, at least to some extent. Were I in charge of my city, I would publish every budget decision online. I take the point that this costs money, but transparency would be worth it."},
wri:{task:"Bir gazetenin görüş sayfası için ‘Oy verme yaşı 16’ya indirilmeli mi?’ konulu yazı yaz (220–260 kelime). Temkinli dil ve en az bir devrik koşul cümlesi kullan.",tips:["Net ama ölçülü bir tezle başla.","İddialarını hedging ile yumuşat (tend to, arguably).","Karşı görüşü kabul et ve cevapla (Granted,… / I take the point that…).","Devrik koşul cümlesiyle güçlü bir sonuç yaz."],m:"Should the voting age be lowered to sixteen?\n\nThe question of who deserves a voice in elections has never been settled once and for all. It would seem reasonable, therefore, to ask whether sixteen-year-olds should be given the vote.\n\nThe case in favour is stronger than it first appears. Decisions taken today on climate, education and debt will arguably affect young people more than anyone else. There is also some evidence to suggest that those who vote early tend to keep voting throughout their lives, which would strengthen democracy as a whole.\n\nCritics argue that teenagers lack the experience to make informed choices. Granted, many sixteen-year-olds know little about economics. The same could be said, however, of a considerable number of adults, and nobody proposes testing their knowledge before an election. Maturity is not something that arrives overnight on an eighteenth birthday.\n\nA more serious objection is that young voters may simply follow their parents or be swayed by social media. This risk should not be dismissed. Provided that schools offered serious political education, though, it could be greatly reduced.\n\nOn balance, the change appears to be worth trying. Were it to be introduced alongside better civic education, we might find that young people take their responsibilities more seriously than we expect. Had previous generations refused every extension of the vote, our democracies would look very different today."},
quiz:[["___ I known the truth, I would have acted differently.",["Had","If","Would"],0],["___ you need any help, just call me.",["Should","Had","Were"],0],["___ we to accept, we would lose everything.",["Were","Had","Should"],0],["You can borrow it ___ that you return it tomorrow.",["provided","unless","supposing"],0],["Older voters ___ to be more cautious.",["tend","seem that","arguably"],0],["The scandal ___ trust in the government.",["undermined","conceded","lobbied"],0]]},

{n:3,t:"Innovation",tr:"İnovasyon ve etik",
lessons:[["3.1","İsimleştirme","Nominalisation and complex noun phrases","Technology and progress"],["3.2","Kim yaptı? Önemli değil","Advanced and impersonal passives","Ethics"],["3.3","Artıları ve eksileri tartmak","Evaluating ideas","Evaluation phrases"],["3.4","Proje","—","Yeni bir teknolojinin etik değerlendirmesi"]],
sum:"Teknoloji, ilerleme ve etik. Akademik yazının temel aracı olan isimleştirmeyi (decide → decision, the rapid growth of…) ve ileri edilgen yapıları (is believed to have been…, It has been suggested that…) öğrenirsin. Bir fikri artıları ve eksileriyle değerlendirmeyi çalışırsın.",
words:[["breakthrough","çığır açan gelişme","Scientists announced a major breakthrough."],["disruptive","yerleşik düzeni sarsan","Streaming was a disruptive technology."],["ethical","etik","Is it ethical to edit human genes?"],["unprecedented","benzeri görülmemiş","The speed of change is unprecedented."],["implications","sonuçlar, etkiler","We must consider the long-term implications."],["safeguard","koruma önlemi; korumak","Strong safeguards are needed to protect privacy."],["algorithm","algoritma","The algorithm decides what you see."],["automate","otomatikleştirmek","Many routine tasks have been automated."],["feasible","uygulanabilir","The plan is not financially feasible."],["pioneer","öncü; öncülük etmek","She pioneered a new surgical technique."],["trade-off","ödünleşim","There is a trade-off between speed and safety."],["state-of-the-art","en son teknoloji","The lab has state-of-the-art equipment."]],
gram:[{t:"Nominalisation",e:"Fiil ya da sıfatı isme çevirerek cümleyi daha yoğun ve resmî hâle getirir: develop → development, fail → failure, able → ability. Böylece özne kişiden fikre kayar: ‘People use AI more’ → ‘The increasing use of AI’. İsim öbeği sıfat, edat ve relative clause ile genişletilir.",f:"They decided quickly. → Their quick decision… / the rapid growth of online learning",ex:["The introduction of the new law caused widespread concern.","There has been a significant increase in the use of automation.","The failure of the experiment led to a change of approach.","Growing public awareness of privacy issues has forced companies to act."]},
{t:"Advanced and impersonal passives",e:"Geçmişe gönderme yapan raporlama edilgeni: be thought / believed / said + to have + V3 (edilgense to have been + V3). Kişisiz giriş: It has been suggested / argued / shown that… Edatlı ve iki nesneli edilgenler: She was given a prize. The issue was dealt with.",f:"The data is believed to have been lost. / It has been argued that…",ex:["The files are believed to have been deleted by mistake.","It has been argued that regulation slows innovation.","The technique is thought to have been developed in the 1990s.","The problem has not yet been dealt with."]}],
phr:{t:"Evaluating ideas (Değerlendirme)",items:["The main benefit is that…","A potential drawback, however, is…","It remains to be seen whether…","The benefits clearly outweigh the risks.","This raises the question of…","On closer inspection,…"]},
lis:{t:"A lecture extract on technology and ethics",text:"The development of any powerful technology raises the same question: who is responsible when something goes wrong? Take automated decision-making. It has been shown that algorithms can repeat human prejudice, because they learn from data produced by humans. The main benefit is speed. A potential drawback, however, is that nobody can fully explain how a particular decision was reached. In one case, hundreds of applicants are believed to have been rejected for a job simply because of where they lived. It remains to be seen whether regulation can keep up. What is clear is that the trade-off between efficiency and fairness cannot be left to engineers alone.",
q:[["Why can algorithms repeat human prejudice?",["They learn from data produced by humans","They are badly built","They are too slow"],0],["What is the drawback mentioned?",["Decisions cannot be fully explained","They are expensive","They need electricity"],0],["What should not be left to engineers alone?",["The trade-off between efficiency and fairness","Writing the code","Testing the product"],0]]},
spk:{p:["Which recent breakthrough do you think will change life most? Evaluate its benefits and risks.","Nominalise: ‘People are using AI more, so jobs are changing.’ Say it in a formal way.","Is it ethical to use AI to mark exams or select job candidates?","Discuss: Should some research be banned?"],m:"I think the breakthrough with the greatest impact is AI in medicine. The main benefit is earlier diagnosis. A potential drawback, however, is our growing dependence on systems we don’t fully understand. In formal terms: the increasing use of AI is leading to significant changes in the nature of work. It remains to be seen whether the benefits outweigh the risks."},
wri:{task:"Bir üniversite dergisi için kısa bir akademik değerlendirme yaz: ‘Yapay zekâ eğitimde kullanılmalı mı?’ (220–260 kelime). İsimleştirme ve kişisiz edilgen kullan.",tips:["Kişisel ‘I think’ yerine kişisiz yapılar kullan (It has been argued that…).","Fiilleri isimleştir: use → the use of.","Bir paragraf fayda, bir paragraf risk, bir paragraf öneri.","Hedging’i unutma."],m:"The Use of Artificial Intelligence in Education\n\nThe rapid development of artificial intelligence has led to considerable debate about its place in the classroom. This article evaluates the main benefits and risks.\n\nThe principal advantage is personalisation. It has been shown that students learn more effectively when material is adapted to their level, something a single teacher with thirty pupils can rarely achieve. The automation of routine tasks, such as the marking of simple exercises, could also give teachers more time for discussion and support.\n\nThere are, however, significant concerns. Over-reliance on such tools may lead to a decline in independent thinking. It has also been argued that the collection of large amounts of student data poses a threat to privacy, particularly where safeguards are weak. Furthermore, unequal access to technology is likely to widen the gap between wealthy and poorer schools.\n\nIt would therefore seem sensible to proceed with caution. The introduction of AI should be accompanied by clear rules on data protection and by training for teachers. Its role should be to support, rather than replace, human judgement.\n\nIn conclusion, the potential benefits are considerable, but they are by no means guaranteed. The success of the technology will depend less on its sophistication than on the way in which it is implemented."},
quiz:[["The ___ of the new system took two years.",["development","develop","developing"],0],["There has been a sharp ___ in demand.",["increase","increasing","increased"],0],["The painting is thought ___ in 1650.",["to have been painted","to paint","to have painted"],0],["It ___ that the policy has failed.",["has been argued","has argued","is arguing"],0],["The plan isn’t ___. We don’t have the money.",["feasible","ethical","disruptive"],0],["There’s a ___ between cost and quality.",["trade-off","breakthrough","safeguard"],0]]},

{n:4,t:"Behaviour",tr:"Zihin ve davranış",
lessons:[["4.1","Kısa ve öz","Participle clauses","Psychology"],["4.2","Tekrardan kaçınmak","Ellipsis and substitution","Behaviour"],["4.3","Araştırma sonucu aktarmak","Describing research findings","Research phrases"],["4.4","Proje","—","Bir psikoloji deneyini özetle"]],
sum:"Psikoloji, karar verme ve davranış. Cümleleri kısaltan participle clause’ları (Having finished…, Faced with…) ve tekrarı önleyen ellipsis / substitution yapılarını (so, do so, neither, one) öğrenirsin. Bir araştırmanın bulgularını özetlemeyi çalışırsın.",
words:[["cognitive bias","bilişsel yanlılık","We are all affected by cognitive bias."],["perception","algı","Our perception of risk is often wrong."],["instinct","içgüdü","Trust your instincts."],["impulsive","düşünmeden hareket eden","He made an impulsive decision."],["rational","akılcı","Humans are less rational than we think."],["subconscious","bilinçaltı","Advertising works on a subconscious level."],["peer pressure","akran baskısı","Teenagers are sensitive to peer pressure."],["conform","uymak, ayak uydurmak","Most people conform to the group."],["trait","özellik (kişilik)","Patience is a useful trait."],["nurture","yetiştirme, çevre etkisi","Is personality nature or nurture?"],["empathy","empati","Reading fiction may increase empathy."],["reinforce","pekiştirmek","Praise reinforces good behaviour."]],
gram:[{t:"Participle clauses",e:"İki cümleyi tek özneyle kısaltır. V-ing: aynı anda ya da neden (Feeling tired, I went to bed). Having + V3: önce tamamlanan eylem (Having read the report, she called a meeting). V3: edilgen anlam (Faced with a choice, people hesitate). Olumsuzu not ile. İki cümlenin öznesi aynı olmalıdır.",f:"Not knowing what to do, I waited. / Having finished, we left. / Given the choice,…",ex:["Not wanting to seem rude, he agreed.","Having studied the results, the team changed its approach.","Faced with too many options, people often choose nothing.","Seen from this angle, the problem looks different."]},
{t:"Ellipsis and substitution",e:"Tekrarı önlemek için kelimeler atılır (ellipsis) ya da yerlerine kısa bir sözcük konur (substitution). so / not: I think so. I hope not. do so: They were asked to leave and did so. one / ones: the red one. Yardımcı fiilden sonra atma: She can swim, but I can’t. neither / nor / so + yardımcı + özne.",f:"I think so. / …and so did I. / …but I didn’t want to.",ex:["Some participants conformed, but most didn’t.","He was told to wait and did so.","I’ve never taken part in an experiment, and neither has she.","Will it work? I hope so."]}],
phr:{t:"Describing research (Araştırma aktarma)",items:["According to the study,…","The findings suggest that…","Participants were asked to…","Interestingly, the opposite was true.","The results were consistent with…","One limitation is that…"]},
lis:{t:"A summary of a decision-making experiment",text:"In a well-known type of experiment, shoppers were offered free samples of jam. On some days there were twenty-four flavours on the table; on others, only six. Faced with the larger display, more people stopped to look. Interestingly, however, far fewer of them went on to buy. Having tasted several flavours, they seemed unable to choose. Those offered only six flavours were much more likely to do so. The findings suggest that too much choice can be paralysing. One limitation is that later studies have not always produced the same result, so the effect may depend on the situation.",
q:[["What happened with the larger display?",["More people stopped, but fewer bought","Nobody stopped","Everyone bought"],0],["Who was more likely to buy?",["People offered six flavours","People offered twenty-four flavours","People who didn’t taste"],0],["What is the limitation?",["Later studies didn’t always agree","The jam was expensive","The shop was small"],0]]},
spk:{p:["Describe a time when you made an impulsive decision. What happened?","Do you conform to the group or follow your own instinct? Give an example.","Summarise a study or experiment you know, using research phrases.","Is personality mostly nature or nurture?"],m:"Faced with a sale last month, I bought a jacket I didn’t need, and I regretted it the next day. I like to think I follow my own instinct, but in meetings I often agree with the majority, and so do most of my colleagues. As for personality, I believe traits like empathy are partly inherited, but nurture reinforces them."},
wri:{task:"Bir psikoloji deneyini ya da kendi gözlemini özetleyen kısa bir rapor yaz (220–260 kelime). Participle clause ve araştırma kalıpları kullan.",tips:["Amaç, yöntem, bulgular, sınırlılıklar, sonuç başlıklarını kullan.","Participle clause ile cümleleri kısalt.","Tekrarı önlemek için do so, one, neither kullan.","Bulguları hedging ile aktar."],m:"Report: The Effect of Phones on Attention\n\nAim\nThe purpose of this small study was to find out whether the mere presence of a phone affects concentration.\n\nMethod\nForty university students were asked to complete a twenty-minute reading task. Half were told to leave their phones in another room; the others kept theirs on the desk, switched to silent. Having finished the task, all participants answered ten comprehension questions.\n\nFindings\nStudents working without a phone answered an average of 8.1 questions correctly, compared with 6.4 for those who had one on the desk. Interestingly, none of the second group reported feeling distracted. Asked whether they had thought about their phones, most said they had not, although their results suggested otherwise.\n\nLimitations\nGiven the small number of participants, the results should be treated with caution. The two groups may also have differed in ability, and no attempt was made to test this.\n\nConclusion\nThe findings suggest that a visible phone may reduce attention even when it is not being used. This would be consistent with the idea that part of the mind is subconsciously waiting for a message. Students wishing to study more effectively might therefore try leaving their phones out of sight, at least for short periods, and see whether doing so makes a difference."},
quiz:[["___ the report, she called a meeting.",["Having read","Have read","To have read"],0],["___ what to say, I stayed silent.",["Not knowing","Not known","Not to know"],0],["___ with a difficult choice, he hesitated.",["Faced","Facing to","Having face"],0],["She doesn’t like crowds, and neither ___ I.",["do","am","have"],0],["Is it going to rain? — I hope ___.",["not","no","it doesn’t so"],0],["Teenagers often give in to peer ___.",["pressure","instinct","trait"],0]]},

{n:5,t:"Economy",tr:"Küresel ekonomi",
lessons:[["5.1","Grafik okumak","Describing trends","Economy and trends"],["5.2","Metni birbirine bağlamak","Discourse markers and cohesion","Business"],["5.3","Veri sunmak","Presenting data","Presentation phrases"],["5.4","Proje","—","Bir grafiği yorumlayan mini sunum"]],
sum:"Ekonomi, iş dünyası ve veriler. Eğilimleri anlatan dili (rise sharply, a steady decline, peak at) ve metni tutarlı kılan bağlayıcıları (moreover, nevertheless, consequently, with regard to) öğrenirsin. Bir grafiği sözlü ve yazılı olarak yorumlamayı çalışırsın.",
words:[["recession","durgunluk, resesyon","The country is entering a recession."],["inflation","enflasyon","Inflation reached a ten-year high."],["surge","ani artış; hızla yükselmek","There was a surge in demand."],["plummet","hızla düşmek","Share prices plummeted overnight."],["stagnate","durgunlaşmak","Wages have stagnated for years."],["fluctuate","dalgalanmak","Oil prices fluctuate from week to week."],["outsource","dış kaynak kullanmak","They outsourced customer service."],["disparity","eşitsizlik, fark","There is a growing disparity in income."],["subsidy","devlet desteği","Farmers receive a government subsidy."],["incentive","teşvik","Tax incentives attract investors."],["volatile","değişken, oynak","The market is extremely volatile."],["forecast","tahmin; öngörmek","Growth is forecast to slow next year."]],
gram:[{t:"Describing trends",e:"Fiil + zarf: rise / increase / grow, fall / drop / decline + sharply, steadily, slightly, dramatically. İsim + sıfat: a sharp rise, a gradual fall. Edatlar: rise by 5% (fark), rise to 20% (ulaşılan değer), a rise of 5%, a rise in prices. Diğerleri: peak at, level off, remain stable, fluctuate, reach a low of.",f:"Sales rose sharply. / There was a sharp rise in sales. / Prices fell by 10% to €90.",ex:["Unemployment fell steadily between 2015 and 2019.","There was a dramatic increase in online sales.","Inflation peaked at 12 per cent before levelling off.","Exports rose by 8 per cent to 40 billion dollars."]},
{t:"Discourse markers and cohesion",e:"Ekleme: moreover, furthermore, in addition. Zıtlık: nevertheless, nonetheless, however, on the contrary. Sonuç: consequently, therefore, as a result, hence. Konuya gönderme: with regard to, in terms of, as far as … is concerned. Örnek ve açıklama: for instance, namely, in other words.",f:"Moreover,… / Nevertheless,… / Consequently,… / With regard to…,",ex:["Costs are rising. Moreover, demand is falling.","The plan was risky. Nevertheless, the board approved it.","Interest rates went up; consequently, borrowing fell.","With regard to exports, the outlook is positive."]}],
phr:{t:"Presenting data (Veri sunma)",items:["As you can see from the chart,…","The most striking feature is…","This figure represents…","Compared with the previous year,…","Overall, the trend is upward.","This can be explained by…"]},
lis:{t:"A business presentation",text:"As you can see from the chart, our sales rose steadily during the first two years. The most striking feature, however, is what happened in year three. Sales plummeted by almost forty per cent in six months. This can be explained by two factors. Firstly, a competitor entered the market with a cheaper product. Secondly, inflation reduced what customers were willing to spend. Consequently, we cut prices and outsourced production. Sales then levelled off and have been rising slightly since January. Overall, the trend is upward again. Nevertheless, the market remains volatile, so our forecast for next year is cautious.",
q:[["What happened in year three?",["Sales fell by almost forty per cent","Sales doubled","Sales stayed the same"],0],["Which is one reason given?",["A competitor with a cheaper product","A factory fire","A new tax"],0],["What is the forecast for next year?",["Cautious","Very optimistic","Negative"],0]]},
spk:{p:["Describe how prices or rents have changed in your city over the last five years.","Present a simple chart of your own life: for example, hours of English study per month.","Connect ideas: ‘Wages stagnated. Prices rose.’ Use three different discourse markers.","Discuss: Is economic growth always a good thing?"],m:"Rents in my city have risen dramatically over the last five years. They increased by about two hundred per cent and peaked last summer before levelling off. Wages, on the other hand, have stagnated. Consequently, many young people have moved back in with their parents. With regard to the future, prices are forecast to rise more slowly. Nevertheless, the disparity between income and housing costs remains a serious problem."},
wri:{task:"Bir grafiği yorumlayan kısa rapor yaz (200–240 kelime): Bir şirketin beş yıllık satışları yılda sırasıyla 20, 35, 60, 38 ve 45 milyon dolar. Eğilim dili ve bağlayıcılar kullan.",tips:["İlk cümlede grafiğin ne gösterdiğini söyle.","Genel eğilimi özetle (Overall,…).","Önemli noktaları sayılarla anlat (rose by…, peaked at…).","Kişisel görüş ekleme; betimle."],m:"The chart shows the annual sales of a technology company over a five-year period, measured in millions of dollars.\n\nOverall, sales more than doubled during the period, although growth was far from steady. The most striking feature is the sharp fall in the fourth year.\n\nIn the first year, sales stood at 20 million dollars. They then rose significantly, by 15 million, to reach 35 million in the second year. This upward trend continued even more strongly in year three, when sales surged to a peak of 60 million, three times the original figure.\n\nIn the fourth year, however, there was a dramatic decline. Sales plummeted by more than a third, falling to 38 million dollars. Nevertheless, the company did not return to its starting point, and the figure remained well above that of the second year.\n\nIn the final year, sales recovered slightly, rising by 7 million to 45 million dollars. Consequently, the period ended on a positive note, albeit below the earlier peak.\n\nIn summary, with regard to the five years as a whole, the company experienced rapid growth followed by a sharp correction and a partial recovery."},
quiz:[["Prices rose ___ 5% last year.",["by","with","at"],0],["There was a sharp rise ___ unemployment.",["in","of the","by"],0],["Sales ___ at 60 million before falling.",["peaked","plummeted","stagnated"],0],["The project was expensive. ___, it was approved.",["Nevertheless","Consequently","Moreover"],0],["Demand fell; ___, the factory closed.",["consequently","nevertheless","on the contrary"],0],["Share prices are very ___ at the moment.",["volatile","feasible","rational"],0]]},

{n:6,t:"Futures",tr:"Gelecek ve öğrenme",
lessons:[["6.1","Artık zamanı geldi","Unreal past and subjunctive: It’s time, I’d rather, as if","Education and change"],["6.2","Olacaktı","Future in the past; be to, be on the verge of","The future of work"],["6.3","Geleceği tartışmak","Speculating about the future","Speculation phrases"],["6.4","Proje","—","2050’de eğitim üzerine konuşma"]],
sum:"Gelecek, öğrenme ve değişim. Gerçek dışı geçmiş yapılarını (It’s time we acted, I’d rather you didn’t, as if), dilek kipini (suggest that he be) ve geçmişteki gelecek anlatımını (was going to, was to have) öğrenirsin. Geleceğe dair senaryoları tartışmayı çalışırsın.",
words:[["lifelong learning","yaşam boyu öğrenme","Lifelong learning is no longer optional."],["obsolete","modası geçmiş, kullanılmaz","Many skills become obsolete quickly."],["adaptability","uyum yeteneği","Employers value adaptability."],["upskill","becerilerini geliştirmek","Workers need to upskill constantly."],["critical thinking","eleştirel düşünme","Schools should teach critical thinking."],["foresee","öngörmek","Nobody foresaw the crisis."],["inevitable","kaçınılmaz","Change is inevitable."],["scenario","senaryo","Consider the worst-case scenario."],["mindset","zihniyet","A growth mindset helps you learn."],["thrive","gelişmek, serpilmek","Some people thrive under pressure."],["redundant","gereksiz hâle gelmiş","The new software made the old system redundant."],["curriculum","müfredat","The curriculum needs updating."]],
gram:[{t:"Unreal past and subjunctive",e:"It’s (high) time + past simple: artık yapılmalı (It’s time we changed). would rather / would sooner + özne + past simple: başkasının yapmasını tercih etmek (I’d rather you stayed). as if / as though + past: gerçek dışı benzetme (He talks as if he knew everything). Dilek kipi (resmî): suggest / insist / recommend / demand that + özne + yalın fiil (that he be informed).",f:"It’s time we left. / I’d rather you didn’t. / They insisted that she attend.",ex:["It’s high time schools taught financial skills.","I’d rather you didn’t use your phone in class.","She speaks as though she had lived there for years.","The report recommends that every student be given a mentor."]},
{t:"Future in the past; be to, be on the verge of",e:"Geçmişten bakınca gelecek: was / were going to (plan, çoğu zaman gerçekleşmedi), would (tahmin), was to (kader gibi sonradan olan), was to have + V3 (planlanmıştı ama olmadı). Resmî gelecek: be to + V1 (The minister is to visit…). be on the verge / point of + V-ing: olmak üzere.",f:"I was going to call, but… / He was to become… / The talks are to begin…",ex:["I was going to study law, but I changed my mind.","Little did she know that she would become a professor.","The course was to have started in May, but it was postponed.","The company is on the verge of launching a new platform."]}],
phr:{t:"Speculating about the future (Gelecek tahmini)",items:["In all likelihood,…","There’s every chance that…","I very much doubt that…","It’s only a matter of time before…","The odds are that…","Who knows? We may well…"]},
lis:{t:"A talk on the future of learning",text:"When I started teaching, I was going to do the same job, in the same way, for forty years. That was the plan. Little did I know that half of what I taught would become obsolete within a decade. So what should schools do? It’s high time we stopped treating education as something that ends at twenty-two. In all likelihood, today’s students will change career several times. I’d rather they learned how to learn than memorised facts they can find in seconds. There’s every chance that adaptability will matter more than any single qualification. The schools that thrive will be those that teach critical thinking as if it were as basic as reading.",
q:[["What did the speaker originally expect?",["To do the same job the same way for forty years","To change career often","To retire early"],0],["What should students learn, according to the speaker?",["How to learn","More facts","A single profession"],0],["What will probably matter more than a qualification?",["Adaptability","Memory","Age"],0]]},
spk:{p:["What is it high time people in your country did?","Talk about a plan that changed: I was going to…, but…","Which skills will be obsolete in twenty years? Which will thrive?","Speculate: What will a typical school day look like in 2050?"],m:"It’s high time we took lifelong learning seriously. I was going to become an accountant, but I discovered programming and changed direction. In all likelihood, routine office skills will become redundant, whereas creativity and empathy will thrive. I very much doubt that classrooms will disappear by 2050, but there’s every chance that students will learn at their own pace."},
wri:{task:"Bir eğitim konferansı için ‘Okullar değişen dünyaya nasıl hazırlanmalı?’ konulu öneri yazısı yaz (220–260 kelime). It’s time, I’d rather ve dilek kipi yapılarını kullan.",tips:["Sorunu net koy: neden değişim şart?","2–3 öneri: recommend / suggest that + yalın fiil.","Resmî ve ikna edici bir ton kullan.","Geleceğe dönük güçlü bir kapanış yaz."],m:"Preparing Schools for a Changing World\n\nWhen today’s teachers were students themselves, they were told that a good degree would guarantee a job for life. That promise was to prove false. It is high time our schools accepted that the world they were designed for no longer exists.\n\nThe central problem is that the curriculum still rewards memory rather than understanding. In all likelihood, a child starting school this year will work in a profession that has not yet been invented. Facts can be found in seconds; the ability to evaluate them cannot.\n\nI would therefore make three recommendations. First, I suggest that critical thinking be taught as a subject in its own right from primary school onwards. Second, it is essential that every student complete at least one long-term project each year, working with others on a real problem. Third, I would rather schools assessed progress continuously than relied on a single exam at the end of the year, which measures little more than performance under pressure.\n\nNone of this will be easy. Teachers will need time and training, and parents may resist change. Nevertheless, the alternative is to go on preparing young people for a world that has already disappeared.\n\nEducation should not behave as though the future were a copy of the past. The schools that thrive will be those brave enough to change first."},

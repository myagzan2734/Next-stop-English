{t:"Okuma",text:"The idea that practice alone produces excellence has proved remarkably popular. According to the best-known version, ten thousand hours of effort are enough to master almost any skill. On closer inspection, however, the evidence is less clear. The original research examined violinists who were already highly selected, and it measured averages, not individuals. Some reached the top having practised far less; others never did so, despite practising more. Later studies suggest that practice accounts for only a part of the difference in performance, the size of which varies widely between fields. None of this means that effort is unimportant. What it does mean is that the quality of practice, the age at which one begins and, arguably, natural ability all play a role. The appeal of the simple rule lies in its promise that anyone can succeed. Reality, as so often, is more complicated.",

{t:"Dinleme",audio:"Presenter: You argue that cities should be redesigned around a fifteen-minute walk. Isn’t that unrealistic?\nPlanner: I take your point, but I’d say the opposite is true. It’s our current model that is unsustainable. Were we to keep building suburbs that depend entirely on cars, congestion would only get worse.\nPresenter: Critics claim it would restrict freedom.\nPlanner: That, I simply cannot accept. Nobody would be forced to stay in their neighbourhood. The point is that they wouldn’t have to leave it for basic needs.\nPresenter: And the cost?\nPlanner: Considerable at first. Nevertheless, there is every chance that the savings in health and transport would outweigh it.",

wri:{task:"Akademik bir deneme yaz: ‘Teknolojik ilerleme eşitsizliği azaltır mı, artırır mı?’ (240–280 kelime). İsimleştirme, temkinli dil ve en az bir devrik yapı kullan.",m:"Does technological progress reduce or increase inequality?\n\nRarely has a question divided economists as sharply as the relationship between technology and inequality. The spread of digital tools was expected to create opportunity for all. Whether it has done so is far from clear.\n\nThere are good reasons for optimism. The falling cost of communication has given millions of people access to information, education and markets that were previously out of reach. A farmer with a mobile phone can check prices in a distant city; a student in a remote village can follow lectures from a leading university. Seen from this angle, technology is a powerful equaliser.\n\nNevertheless, the benefits have not been evenly distributed. The automation of routine work has tended to reward those with advanced skills while reducing demand for others. Consequently, the gap between high and low earners has widened in many countries. Moreover, the companies that control the most valuable data are few in number, which arguably concentrates wealth to an unprecedented degree.\n\nIt would seem, then, that technology itself is neither the cause of inequality nor its cure. Its effects depend on the choices that accompany it. Were governments to invest seriously in education and retraining, the gains could be shared far more widely. Should they fail to do so, the disparity is likely to grow.\n\nIn conclusion, progress creates the possibility of greater equality, but by no means guarantees it. What matters is not the invention but the way in which a society decides to use it."}},

{t:"Okuma",text:"In the 1950s, the Japanese rail engineer Hideo Shima was asked to design a train that could travel far faster than anything then in service. Many experts considered the project a waste of money; air travel and cars were thought to be the future. Had the critics been listened to, the first high-speed line might never have been built. It opened in 1964, linking Tokyo and Osaka, and soon carried more passengers than anyone had forecast. What is particularly interesting is how the engineers approached the problem. Rather than building one powerful locomotive, they placed motors along the whole train, which improved acceleration and reduced damage to the track. Not only did the line change travel within Japan, but it also inspired similar networks elsewhere. The lesson, arguably, is that technologies dismissed as obsolete can thrive when they are rethought from first principles.",
qs:[["Why did many experts oppose the project?",["They believed planes and cars were the future","It was too slow","There was no land"],0],["When did the line open?",["In 1964","In the 1950s","In 1974"],0],["What was unusual about the design?",["Motors were placed along the whole train","It had no driver","It ran on water"],0],["What lesson does the writer draw?",["Old technologies can thrive when rethought","Trains are obsolete","Experts are always right"],0]]},
{t:"Dinleme",audio:"Host: Your book claims that multitasking is a myth. Surely we do it all the time?\nAuthor: We think so, but what we actually do is switch rapidly between tasks. Having switched, the brain needs time to refocus, and that is where the cost lies.\nHost: How large is the cost?\nAuthor: It varies. The findings suggest that complex work can take considerably longer when we are interrupted. Interestingly, those who believe they are good at multitasking tend to perform worst.\nHost: So what do you recommend?\nAuthor: I’d rather people worked on one thing for twenty-five minutes than on five things for two hours.",
qs:[["What do we actually do when we ‘multitask’?",["Switch rapidly between tasks","Do two things at once","Work more slowly on purpose"],0],["Who tends to perform worst?",["People who think they are good at multitasking","Beginners","Older workers"],0],["What does the author recommend?",["One task for twenty-five minutes","Five tasks for two hours","Avoiding breaks"],0]]}],
wri:{task:"Bir yöneticiye resmî rapor yaz: Şirketinde uzaktan çalışma uygulamasının bir yıllık sonuçlarını değerlendir ve öneride bulun (240–280 kelime). Başlıklar, eğilim dili ve dilek kipi kullan.",m:"Report: One Year of Remote Working\n\nIntroduction\nThe purpose of this report is to evaluate the remote working scheme introduced twelve months ago and to make recommendations for its future.\n\nFindings\nOverall, the results have been positive. Productivity, measured by completed projects, rose by eight per cent in the first six months before levelling off. Staff turnover fell sharply, from fourteen to nine per cent, which represents a considerable saving in recruitment costs. Moreover, office expenses declined by almost a quarter.\n\nNevertheless, a number of problems have emerged. With regard to communication, forty per cent of employees reported feeling less connected to their teams. New staff appear to have been particularly affected: having joined remotely, several stated that they had found it difficult to learn informal procedures. There was also a slight increase in reported overtime, suggesting that the boundary between work and home has become less clear.\n\nRecommendations\nIn the light of these findings, I would recommend that the scheme be continued in a modified form. Specifically, I suggest that each team attend the office on two fixed days per week, and that every new employee be assigned a mentor for the first three months. It is also essential that managers receive training in leading remote teams.\n\nConclusion\nThe scheme has clearly brought financial benefits, and there is every chance that these will continue. Provided that the issues of communication and workload are dealt with, remote working should remain a permanent feature of the company."}}

function tlSvg(t){const y=34;let s=`<svg class="tl" viewBox="0 0 300 62" role="img" aria-label="Zaman çizelgesi"><line class="ax" x1="10" y1="${y}" x2="288" y2="${y}"/><polygon class="ax2" points="288,${y-4} 296,${y} 288,${y+4}"/><line class="now" x1="150" y1="14" x2="150" y2="${y+10}"/><text x="150" y="10" text-anchor="middle">şimdi</text><text x="12" y="58">geçmiş</text><text x="290" y="58" text-anchor="end">gelecek</text>`;
  (t.bars||[]).forEach(([a,b])=>s+=`<rect class="bar" x="${a}" y="${y-6}" width="${b-a}" height="12" rx="6"/>`);
  (t.stripes||[]).forEach(([a,b])=>s+=`<rect class="stripe" x="${a}" y="${y-6}" width="${b-a}" height="12" rx="3"/>`);
  if(t.arrow){const[a,b]=t.arrow;s+=`<path class="arr" d="M${a} ${y-9} Q ${(a+b)/2} ${y-26} ${b} ${y-9}"/><polygon class="ax2" style="fill:var(--teal)" points="${b-5},${y-13} ${b},${y-7} ${b+2},${y-14}"/>`;}
  (t.ref||[]).forEach(x=>s+=`<line class="ref" x1="${x}" y1="${y-14}" x2="${x}" y2="${y+14}"/>`);
  (t.dots||[]).forEach(x=>s+=`<circle class="dot" cx="${x}" cy="${y}" r="6"/>`);
  return s+"</svg>";}
function tenseCard(t){return `<article class="panel tcard" id="t-${t.id}"><div class="thd"><div><h3 style="margin-bottom:2px">${esc(t.en)}</h3><div class="m">${esc(t.tr)}</div></div><span class="lvl">${t.lv}</span></div>

  case "fiil":return `<div class="panel"><div class="btnrow" style="margin-top:0"><button class="btn ${irrMode==="list"?"pri":""}" data-act="irrmode" data-v="list">Liste</button><button class="btn ${irrMode==="test"?"pri":""}" data-act="irrmode" data-v="test">Kendini test et</button></div>
    <p class="m">${irrMode==="test"?"V2 ve V3 gizli. Önce aklından söyle, sonra gri kutuya dokunup kontrol et.":"V1: yalın hâl, V2: past simple, V3: past participle (present perfect, past perfect ve passive’de kullanılır)."}</p>
    <input class="inp" id="irrq" type="search" placeholder="Fiil ara (ör. go, yazmak)" style="max-width:none;margin-bottom:8px" autocapitalize="none">

  case "test":{const last=DB.current&&me().tq;return `<div class="panel" id="tq"><h3>Zaman testi</h3><p class="m">12 zamanın ve gelecek yapılarının karışık olduğu 15 soru.${last!=null?` Son puanın: ${last}/15.`:""}</p>${qHTML(TQ,"tq")}<div class="btnrow"><button class="btn pri" data-act="checktq">Kontrol et</button><button class="btn" data-act="tqnew">Yeniden başla</button></div><div id="tqres"></div></div>`;}
  }}

const synth=("speechSynthesis" in window)?window.speechSynthesis:null;let voice=null,rate=0.9;
function pickVoice(){if(!synth)return;const v=synth.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}

function speak(text,isDialog,r){
  if(!synth){toast("Bu cihazda sesli okuma desteklenmiyor. Metni okuyarak devam edebilirsin.");return;}
  synth.cancel();const lines=isDialog?text.split("\n").filter(Boolean):[text];const pitch={};let k=0;
  lines.forEach(l=>{let t=l,p=1;const m=l.match(/^([A-Z][A-Za-z ]{0,14}):\s*(.*)$/);
    if(m){if(!(m[1] in pitch))pitch[m[1]]=(k++%2)?1.3:0.85;p=pitch[m[1]];t=m[2];}
    const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=r||rate;u.pitch=p;synth.speak(u);});}
function stopSpeak(){if(synth)synth.cancel();}

/* ===================== WORDS, SRS, PROGRESS ===================== */
function allWords(S,u){const L=LS(S.id);
  return u.words.map((w,i)=>({en:w[0],tr:w[1],ex:w[2],k:S.id+":"+u.n+"-"+i})).concat((L.custom[u.n]||[]).map(w=>({en:w.en,tr:w.tr,ex:w.ex,k:S.id+":c"+u.n+"-"+w.id,id:w.id,mine:true})));}
function wordMap(){const m={};STAGES.forEach(S=>S.units.forEach(u=>allWords(S,u).forEach(w=>{m[w.k]=w;})));return m;}
const IV=[0,1,3,7,14,30,60];
function srsSet(k,b){b=Math.max(1,Math.min(b,6));const d=new Date();d.setDate(d.getDate()+IV[b]);me().srs[k]={b,d:dkey(d)};}
function dueWords(){const m=wordMap(),s=me().srs,t=dkey();return Object.keys(s).filter(k=>s[k].d<=t&&m[k]).map(k=>m[k]);}
function wordStats(){const m=wordMap(),s=me().srs;let n=0,strong=0;for(const k in s)if(m[k]){n++;if(s[k].b>=4)strong++;}return{n,strong,total:Object.keys(m).length};}
function stepState(S,u){const L=LS(S.id),W=allWords(S,u),s=me().srs,seen=W.filter(w=>s[w.k]).length,g=u.gram.filter((x,i)=>L.gram[u.n+"-"+i]).length;
  return{words:seen/W.length,wn:seen,wt:W.length,gram:g/u.gram.length,gn:g,lis:L.lis["lis"+u.n]!=null?1:0,spk:L.spk[u.n]?1:0,wri:wc(L.text["u"+u.n])>=30?1:0,quiz:L.quiz[u.n]!=null?1:0};}
const unitPct=(S,u)=>{const s=stepState(S,u);return Math.round((s.words+s.gram+s.lis+s.spk+s.wri+s.quiz)/6*100);};
const stagePct=S=>Math.round(S.units.reduce((a,u)=>a+unitPct(S,u),0)/S.units.length);
const curUnit=S=>S.units.find(u=>unitPct(S,u)<100)||null;
function addXp(n){const u=me();u.xp=(u.xp||0)+n;const d=dkey();u.days[d]=(u.days[d]||0)+n;}
function streak(){const D=me().days;let n=0;const d=new Date();if(!D[dkey(d)])d.setDate(d.getDate()-1);while(D[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function logAct(ic,label,score){const u=me();u.log.unshift({t:Date.now(),ic,label,score:score||""});u.log=u.log.slice(0,60);}

/* ===================== CARD BUILDERS ===================== */
const cleanS=s=>!/[→—\/()✗✓:…“”‘]/.test(s);
const nw=s=>s.trim().split(/\s+/).length;
function mcWord(w,pool,rev){const others=shuffle([...new Set(pool.filter(x=>x.tr!==w.tr&&x.en!==w.en).map(x=>rev?x.en:x.tr))]).slice(0,2);
  return{k:"mc",q:rev?"“"+w.tr+"” İngilizcesi hangisi?":"“"+w.en+"” ne demek?",opts:shuffle([rev?w.en:w.tr].concat(others)),a:rev?w.en:w.tr,say:rev?null:w.en};}
const mcQ=(x,grp)=>({k:"mc",q:x[0],opts:shuffle(x[1].slice()),a:x[1][x[2]],grp});
function wordCards(S,u){const W=allWords(S,u),s=me().srs,un=W.filter(w=>!s[w.k]).slice(0,6);
  if(!un.length)return shuffle(W.slice()).slice(0,10).map(w=>({k:"rev",w}));
  return un.map(w=>({k:"new",w})).concat(shuffle(un.slice()).map(w=>mcWord(w,W,false)),shuffle(un.slice()).slice(0,3).map(w=>mcWord(w,W,true)));}
function gramCards(S,u){const c=[];u.gram.forEach(g=>{
    c.push({k:"info",h:g.t,html:`<p>${esc(g.e)}</p><div class="formula">${esc(g.f)}</div><ul class="exs">${g.ex.map(x=>`<li>${sayBtn(x)}<span>${esc(x)}</span></li>`).join("")}</ul>`});
    g.ex.filter(x=>cleanS(x)&&nw(x)>=3&&nw(x)<=10).slice(0,3).forEach(x=>c.push({k:"order",s:x}));});return c;}
function sentences(text){return(text.split("\n").map(l=>l.replace(/^[A-Z][A-Za-z ]{0,14}:\s*/,"")).join(" ").match(/[^.!?]+[.!?]+/g)||[]).map(x=>x.trim()).filter(x=>nw(x)>=4&&nw(x)<=10&&!/\d/.test(x)&&cleanS(x));}
function lisCards(S,u){return[{k:"audio",t:u.lis.t,text:u.lis.text}].concat(u.lis.q.map(x=>mcQ(x,"lis")),shuffle(sentences(u.lis.text)).slice(0,2).map(s=>({k:"dict",s})));}
const phrOf=u=>u.phr.items.filter(x=>cleanS(x)&&nw(x)<=10&&!/Dikkat/.test(x));
function spkCards(S,u){return phrOf(u).slice(0,5).map(s=>({k:"shadow",s})).concat([{k:"talk",p:u.spk.p[0],m:u.spk.m},{k:"talk",p:u.spk.p[1]}]);}
function revCards(){return shuffle(dueWords()).slice(0,20).map(w=>({k:"rev",w}));}
function poolEx(S){const a=[];S.units.forEach(u=>u.gram.forEach(g=>g.ex.forEach(x=>{if(cleanS(x)&&nw(x)>=4&&nw(x)<=10)a.push(x);})));return a;}
function poolPhr(S){const a=[];S.units.forEach(u=>phrOf(u).forEach(x=>{if(nw(x)>=3)a.push(x);}));return a;}
function readCards(S){const src=[];S.units.forEach(u=>{if(!isDlg(u.lis.text))src.push({t:u.lis.t,text:u.lis.text,q:u.lis.q});});
  Object.values(S.exams).forEach(e=>e.secs.forEach(s=>{if(s.text)src.push({t:e.t+" okuma parçası",text:s.text,q:s.qs});}));
  const r=src[Math.floor(Math.random()*src.length)];return[{k:"read",t:r.t,text:r.text}].concat(r.q.map(x=>mcQ(x,"read")));}

let SES=null;
function startSession(title,cards,back,onDone){if(!cards.length){toast("Bu adımda şu an yapılacak bir şey yok.");return;}

function runStep(S,u,step,back,after){const L=LS(S.id),nm=S.code+" Ünite "+u.n;const fin=f=>()=>{f&&f();after&&after();};
  if(step==="words")return startSession(nm+": Kelimeler",wordCards(S,u),back,fin());
  if(step==="gram")return startSession(nm+": Dilbilgisi",gramCards(S,u),back,fin(()=>{u.gram.forEach((g,i)=>L.gram[u.n+"-"+i]=1);logAct("🧠",nm+" dilbilgisi");}));
  if(step==="lis")return startSession(nm+": Dinleme",lisCards(S,u),back,fin(()=>{const r=SES.res.filter(x=>x.grp==="lis"),ok=r.filter(x=>x.ok).length;L.lis["lis"+u.n]=r.length?ok/r.length:1;logAct("🎧",nm+" dinleme",ok+"/"+r.length);}));
  if(step==="spk")return startSession(nm+": Konuşma",spkCards(S,u),back,fin(()=>{L.spk[u.n]=1;logAct("🎤",nm+" konuşma");}));
  if(step==="wri")return startSession(nm+": Yazma",[{k:"write",task:u.wri.task,tips:u.wri.tips,m:u.wri.m,sid:S.id,key:"u"+u.n}],back,fin(()=>logAct("✍️",nm+" yazma")));
  if(step==="quiz")return startSession(nm+": Ünite testi",u.quiz.map(x=>mcQ(x,"quiz")),back,fin(()=>{const r=SES.res.filter(x=>x.grp==="quiz"),ok=r.filter(x=>x.ok).length;L.quiz[u.n]=ok;logAct("✅",nm+" testi",ok+"/"+r.length);}));}
function runPractice(id,back,after){const S=stg(me().level);
  if(id==="rev")return startSession("Kelime tekrarı",revCards(),back,after);
  if(id==="dict")return startSession("Dikte",shuffle(poolEx(S)).slice(0,5).map(s=>({k:"dict",s})),back,after);
  if(id==="shadow")return startSession("Gölgeleme",shuffle(poolPhr(S)).slice(0,5).map(s=>({k:"shadow",s})),back,after);
  if(id==="order")return startSession("Kelime sırası",shuffle(poolEx(S)).slice(0,6).map(s=>({k:"order",s})),back,after);

function play(){if(!SES){location.hash="#today";return "";}

  const c=SES.cards[SES.i],pct=Math.round(SES.i/SES.cards.length*100);
  return `<div class="ses"><div class="sestop"><a class="sx" href="#${SES.back}" data-act="sesclose" aria-label="Kapat">✕</a><div class="sesbar" aria-label="İlerleme %${pct}"><i style="width:${pct}%"></i></div><span class="sesxp">+${SES.xp} XP</span></div><div class="sesttl">${esc(SES.title)}, ${SES.i+1}/${SES.cards.length}</div><div class="sescard">${cardHTML(c)}</div><div class="sesfoot">${footHTML(c)}</div></div>`;}
function rses(auto){$("#app").innerHTML=play();if(auto&&SES&&!SES.done){const c=SES.cards[SES.i];if(c.k==="new")speak(c.w.en);else if(c.k==="dict"||c.k==="shadow")speak(c.s);else if(c.k==="mc"&&c.say)speak(c.say);}}
function sesAdvance(){const c=SES.cards[SES.i],st=SES.c;let g=0;
  if(c.k==="new"){if(!me().srs[c.w.k])srsSet(c.w.k,1);g=3;}
  else if(c.k==="mc"){const ok=c.opts[st.ans]===c.a;SES.res.push({grp:c.grp||"w",ok});g=ok?2:0;}
  else if(c.k==="order"){SES.res.push({grp:"o",ok:st.ok});g=st.ok?4:1;}
  else if(c.k==="dict"){SES.res.push({grp:"d",ok:st.ok});g=st.ok?5:2;}
  else if(c.k==="shadow")g=5;else if(c.k==="talk")g=8;else if(c.k==="info"||c.k==="audio"||c.k==="read")g=2;
  else if(c.k==="write")g=wc(LS(c.sid).text[c.key])>=30?20:0;
  SES.xp+=g;addXp(g);SES.i++;SES.c={};stopSpeak();clearInterval(timerId);
  if(SES.i>=SES.cards.length){if(SES.onDone)SES.onDone();SES.done=true;}save();rses(true);window.scrollTo(0,0);}

function route(){stopSpeak();clearInterval(timerId);clearInterval(examTimer);
  let h=(location.hash||"#today").slice(1),html,m;
  if(!DB.current)h="login";else if(h==="login")h=store?"today":"level";else if(!store&&!["level","zamanlar","cumle","play"].includes(h))h="level";
  if(h==="home")h="today";if(h==="dashboard")h="profile";
  if(h==="level"&&lastRoute!=="level"&&lastRoute!=="play"){pickBook=me().level;pickGoal=me().goalXp||60;}
  if(h==="play"&&!SES)h=store?"today":"level";
  lastRoute=CUR=h;document.body.classList.toggle("insession",h==="play");
  if(h==="login")html=login();else if(h==="level")html=levelPage();else if(h==="play")html=play();
  else if(h==="path")html=pathView();else if(h==="practice")html=practice();else if(h==="guide")html=guide();else if(h==="profile")html=profile();
  else if(h==="zamanlar")html=zamanlar();else if(h==="cumle")html=cumle();
  else if((m=h.match(/^unit-([a-z0-9]+)-(\d{1,2})$/))&&stg(m[1])&&stg(m[1]).units[+m[2]-1])html=unitView(stg(m[1]),stg(m[1]).units[+m[2]-1]);
  else if((m=h.match(/^unit-(\d{1,2})$/))&&stg(me().level).units[+m[1]-1])html=unitView(stg(me().level),stg(me().level).units[+m[1]-1]);
  else if((m=h.match(/^exam-([a-z0-9]+)-([a-z-]+)$/))&&stg(m[1])&&stg(m[1]).exams[m[2]])html=examView(stg(m[1]),m[2]);
  else{CUR="today";html=today();}
  $("#app").innerHTML=html;renderNav();window.scrollTo(0,0);
  if(h==="play"&&SES&&!SES.done){const c=SES.cards[SES.i];if(c.k==="new")speak(c.w.en);else if(c.k==="dict"||c.k==="shadow")speak(c.s);}}
window.addEventListener("hashchange",route);
function armed(b,fn){if(b.dataset.armed){fn();return;}const o=b.textContent;b.dataset.armed="1";b.textContent="Emin misin? Tekrar dokun";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o;}},4000);}

document.addEventListener("submit",e=>{
  if(e.target.id==="loginf"){e.preventDefault();doLogin($("#uname").value);}
  else if(e.target.id==="addw"){e.preventDefault();const S=stg(e.target.dataset.s),n=+e.target.dataset.n,un=S.units[n-1],en=$("#aw-en").value.trim(),tr=$("#aw-tr").value.trim(),ex=$("#aw-ex").value.trim();
    if(!en||!tr){toast("İngilizce kelimeyi ve Türkçe anlamını yazmalısın.");return;}
    if(allWords(S,un).some(w=>w.en.toLowerCase()===en.toLowerCase())){toast("Bu kelime bu durakta zaten var.");return;}
    const L=LS(S.id);(L.custom[n]=L.custom[n]||[]).push({id:Date.now().toString(36),en,tr,ex});save();toast("Kelime eklendi; tekrar sistemine girecek.");route();}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="pick")enter(v);
  else if(a==="say")speak(b.dataset.t,false);
  else if(a==="stop")stopSpeak();
  else if(a==="rate"){rate=+v;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}
  else if(a==="play"){const s=document.getElementById("src-"+b.dataset.k);speak(s.value,isDlg(s.value));}
  /* onboarding */
  else if(a==="goalpick"){pickGoal=+v;$("#app").innerHTML=levelPage();}
  else if(a==="book"){pickBook=v;$("#app").innerHTML=levelPage();}
  else if(a==="place")placement();
  else if(a==="lvsave"){const u=me();u.level=pickBook;u.goalXp=pickGoal;pathOpen=null;bind();save();toast(stg(u.level).code+" "+stg(u.level).name+" hattı seçildi.");location.hash="#today";}
  else if(a==="setstage"){const u=me();u.level=v;bind();save();toast(stg(v).code+" "+stg(v).name+" hattına geçtin.");route();}
  /* main */
  else if(a==="plan")runPlan(v);
  else if(a==="prac")runPractice(v,"practice");
  else if(a==="step"){const S=stg(b.dataset.s);runStep(S,S.units[+b.dataset.n-1],v,"unit-"+S.id+"-"+b.dataset.n);}
  else if(a==="lineopen"){pathOpen=pathOpen===v&&CUR==="path"?"-":v;if(CUR==="path")route();}
  else if(a==="delw")armed(b,()=>{const L=LS(b.dataset.s),n=+b.dataset.n;L.custom[n]=(L.custom[n]||[]).filter(w=>w.id!==b.dataset.id);delete me().srs[b.dataset.s+":c"+n+"-"+b.dataset.id];save();route();});
  /* session */
  else if(a==="sesnext")sesAdvance();
  else if(a==="sesopt"){SES.c.ans=+v;rses();}
  else if(a==="sesshow"){SES.c.shown=true;rses();}
  else if(a==="sesgrade"){const c=SES.cards[SES.i],r=me().srs[c.w.k]||{b:1};
    if(v==="0"){srsSet(c.w.k,1);if(!c.again){SES.cards.push({k:"rev",w:c.w,again:1});}}else if(v==="1")srsSet(c.w.k,Math.max(1,r.b));else srsSet(c.w.k,r.b+1);
    SES.res.push({grp:"r",ok:v!=="0"});SES.xp+=2;addXp(2);SES.i++;SES.c={};if(SES.i>=SES.cards.length){if(SES.onDone)SES.onDone();SES.done=true;}save();rses(true);}
  else if(a==="sespick"){SES.c.ans.push(+v);rses();}
  else if(a==="sesunpick"){SES.c.ans=SES.c.ans.filter(x=>x!==+v);rses();}
  else if(a==="sescheck"){const c=SES.cards[SES.i],st=SES.c;
    if(c.k==="order")st.ok=st.ans.map(id=>st.pool.find(p=>p.i===id).w).join(" ")===c.s;
    else{st.val=$("#dictin").value;st.ok=norm(st.val)===norm(c.s);}
    st.checked=true;rses();if(c.k==="order"||!st.ok)speak(c.s);}
  else if(a==="sesslow")speak(b.dataset.t,false,0.6);
  else if(a==="sesplay"){const c=SES.cards[SES.i];speak(c.text,isDlg(c.text));}
  else if(a==="sesself"){SES.c.tried=true;rses();}
  else if(a==="sesmic"){const st=SES.c,c=SES.cards[SES.i];if(st.rec){try{st.rec.stop();}catch(x){}return;}
    stopSpeak();try{const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
      r.onresult=ev=>{const alts=[...ev.results[0]].map(x=>x.transcript),tw=norm(c.s).split(" ");let best=0,bt=alts[0]||"";
        alts.forEach(t=>{const hw=norm(t).split(" "),sc=Math.round(tw.filter(w=>hw.includes(w)).length/tw.length*100);if(sc>=best){best=sc;bt=t;}});
        st.heard=bt;st.score=best;st.tried=true;st.err=null;};
      r.onerror=ev=>{st.err=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Mikrofon izni verilmedi. Tarayıcı ayarlarından izin ver ya da ‘Söyledim’e bas.":ev.error==="no-speech"?"Ses algılanmadı. Tekrar dene.":"Konuşma tanıma şu an çalışmadı. ‘Söyledim’e basarak devam edebilirsin.";st.tried=true;};
      r.onend=()=>{st.rec=null;if(SES&&SES.cards[SES.i]===c)rses();};st.rec=r;r.start();rses();}
    catch(x){st.err="Konuşma tanıma başlatılamadı. ‘Söyledim’e basarak devam edebilirsin.";st.tried=true;rses();}}
  else if(a==="sesclose"){stopSpeak();if(SES&&SES.c.rec){try{SES.c.rec.stop();}catch(x){}}SES=null;}
  else if(a==="timer"){clearInterval(timerId);let s=60;const el=$("#tm");el.textContent="1:00";b.textContent="Yeniden başlat";
    timerId=setInterval(()=>{s--;el.textContent="0:"+String(Math.max(s,0)).padStart(2,"0");if(s<=0){clearInterval(timerId);el.textContent="Süre doldu";}},1000);}
  /* exam */
  else if(a==="etimer"){clearInterval(examTimer);let s=+v*60;const el=$("#et");b.textContent="Yeniden başlat";
    examTimer=setInterval(()=>{s--;const m=Math.floor(Math.max(s,0)/60),ss=Math.max(s,0)%60;el.textContent=m+":"+String(ss).padStart(2,"0");if(s<=0){clearInterval(examTimer);el.textContent="Süre doldu";}},1000);}
  else if(a==="checkexam"){const S=stg(b.dataset.s),k=b.dataset.k,r=grade($("#exam")),p=Math.round(r.c/r.t*100);LS(S.id).exam[k]=p;addXp(50);logAct("🎓",S.code+" "+S.exams[k].t,"%"+p);save();clearInterval(examTimer);stopSpeak();
    $("#eres").innerHTML=`<div class="panel"><div class="result">${r.c}/${r.t} doğru (%${p})</div><p>${verdict(p)}${r.empty?" Boş bıraktığın soru: "+r.empty+".":""}</p><p class="m">Yeşil işaretli seçenekler doğru cevaplardır. +50 XP kazandın.</p><a class="btn" href="#profile">İlerlememe git</a></div>`;
    b.disabled=true;$("#eres").scrollIntoView({behavior:"smooth",block:"start"});}
  else if(a==="reroute")route();
  /* profile */
  else if(a==="avatar"){me().avatar=v;save();route();}
  else if(a==="goal"){me().goalXp=+v;save();route();}
  else if(a==="logout"){DB.current=null;bind();save();location.hash="#login";route();}
  else if(a==="reset")armed(b,()=>{const u=me(),id=u.level;u.levels[id]=blank();Object.keys(u.srs).forEach(k=>{if(k.startsWith(id+":"))delete u.srs[k];});bind();save();toast("Bu hattın ilerlemesi sıfırlandı.");route();});
  else if(a==="delete")armed(b,()=>{delete DB.users[DB.current];DB.current=null;bind();save();toast("Profil silindi.");location.hash="#login";route();});
  else if(a==="export"){const t=$("#xport");t.hidden=false;t.value=btoa(unescape(encodeURIComponent(JSON.stringify(me()))));t.focus();t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Kopyalandı.")).catch(()=>toast("Metni seçip kopyala."));}catch(x){toast("Metni seçip kopyala.");}}
  else if(a==="import"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#mport").value.trim()))));if(!o||typeof o!=="object"||!o.levels)throw 0;const cur=me();o.name=cur.name;DB.users[DB.current]=o;bind();save();toast("Veriler içe aktarıldı.");location.hash="#today";route();}catch(x){toast("Metin okunamadı. Dışa aktarılan metnin tamamını yapıştırdığından emin ol.");}}
  /* grammar reference */
  else if(a==="ztab"){zTab=v;stopSpeak();rerenderZ();b.scrollIntoView({inline:"center",block:"nearest"});}
  else if(a==="tf"){tFilter=v||null;rerenderZ();}
  else if(a==="tjump"){let el=document.getElementById("t-"+v);if(!el){tFilter=null;rerenderZ();el=document.getElementById("t-"+v);}if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
  else if(a==="irrmode"){irrMode=v;rerenderZ();}
  else if(a==="reveal"){b.classList.remove("hid");b.removeAttribute("data-act");}
  else if(a==="checktq"){const r=grade($("#tq"));me().tq=r.c;addXp(r.c);save();$("#tqres").innerHTML=`<div class="result">${r.c}/${r.t} doğru</div><p>${verdict(r.c/r.t*100)} Yanlış yaptığın zamanların kartlarına ‘12 zaman’ sekmesinden bakabilirsin.</p>`;b.disabled=true;}
  else if(a==="tqnew")rerenderZ();
  /* sentence machine */
  else if(a==="mz"){const k=b.dataset.k;MZ[k]=["s","a","v","o","t","p"].includes(k)?+v:v;if(k==="v")MZ.o=0;
    if(k==="a"&&MZ.f==="modal"&&MM[MZ.a].k==="might"&&MZ.ty==="?")toast("might soru cümlesinde neredeyse hiç kullanılmaz; olumluya geçildi.");
    mzFix(MZ);if(MZ.mode==="test"&&k==="f")mzNew();else if(MZ.mode==="test")MZ.checked=false;rmz();}
  else if(a==="mzmode"){MZ.mode=v;if(MZ.mode==="test")mzNew();rmz();}
  else if(a==="mzcon"){MZ.con=!MZ.con;rmz();}
  else if(a==="mzsay")speak(enS(MZ),false);
  else if(a==="mzrand"){mzRandom(MZ,true);rmz();}
  else if(a==="mzsave"){const u=me(),en=enS(MZ);if(u.fav.some(x=>x.en===en)){toast("Bu cümle zaten defterinde.");return;}u.fav.unshift({en,tr:trB(MZ),t:Date.now()});u.fav=u.fav.slice(0,300);save();toast("Defterine eklendi ★");rmz();}
  else if(a==="mzdel"){me().fav.splice(+v,1);save();rmz();}
  else if(a==="mzcheck"){MZ.checked=true;MZ.tot++;if(trB(MZ)===trB(MZ.tg)){MZ.ok++;if(DB.current&&store){me().mzok=(me().mzok||0)+1;addXp(4);save();}}rmz();}
  else if(a==="mzhint"){MZ.hint=true;rmz();}
  else if(a==="mzans"){MZ.checked=true;MZ.ans=true;rmz();}
  else if(a==="mznew"){mzNew();rmz();}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="dictin"){e.preventDefault();const b=document.querySelector('[data-act="sescheck"]');if(b)b.click();}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="irrq"){const q=t.value.trim().toLocaleLowerCase("tr");document.querySelectorAll(".irr tbody tr").forEach(r=>r.hidden=q&&!r.dataset.s.includes(q));return;}
  if(t.id==="dictin"&&SES){SES.c.val=t.value;return;}
  if(t.tagName==="TEXTAREA"&&t.dataset.k&&store){const k=t.dataset.k;LS(t.dataset.sid||me().level).text[k]=t.value;save();const w=document.getElementById("wc-"+k);if(w)w.textContent=wc(t.value)+" kelime, otomatik kaydedilir";}});
route();

</script>
